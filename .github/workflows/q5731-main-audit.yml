name: Q5731 exact first-digit audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5731_cartier_first_digit_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run exact dependency-free scan
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5731_cartier_first_digit_audit.py > q5731-audit.out 2>&1
          echo $? > q5731-audit.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: q5731-audit
          path: |
            q5731-audit.out
            q5731-audit.status
