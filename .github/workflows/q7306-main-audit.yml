name: Q7306 temporary exact scanner audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q7306-main-audit.yml'
permissions:
  contents: write
concurrency:
  group: q7306-exact-scanner
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and normalize isolated scanner source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin q7306-audit
          git show origin/q7306-audit:problems/3.2/research/q7306_highload_scan.cpp > /tmp/q7306_highload_scan.cpp
          cp /tmp/q7306_highload_scan.cpp /tmp/q7306-source-before.cpp
          sed -i '/^\/\/   g++ /s/ \\$//' /tmp/q7306_highload_scan.cpp
          sed -i '/^\/\/   \.\/q7306_scan /s/ \\$//' /tmp/q7306_highload_scan.cpp
          sed -i 's/    if (limit >= 0) is_prime\[0\] = false;/    is_prime[0] = false;/' /tmp/q7306_highload_scan.cpp
          if cmp -s /tmp/q7306-source-before.cpp /tmp/q7306_highload_scan.cpp; then
            echo 0 > /tmp/q7306-source-changed.status
          else
            echo 1 > /tmp/q7306-source-changed.status
          fi
          sha256sum /tmp/q7306_highload_scan.cpp | awk '{print $1}' > /tmp/q7306-source.sha256
          if git show origin/q7306-audit:problems/3.2/research/q7306/output.json > /tmp/q7306-previous-output.json 2>/dev/null; then
            echo 1 > /tmp/q7306-previous.available
          else
            : > /tmp/q7306-previous-output.json
            echo 0 > /tmp/q7306-previous.available
          fi
      - name: Compile, scan, validate, and extract finite exceptions
        shell: bash
        run: |
          set +e
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            /tmp/q7306_highload_scan.cpp -o /tmp/q7306_scan \
            > /tmp/q7306-build.log 2>&1
          build_status=$?
          echo "$build_status" > /tmp/q7306-build.status
          if [ "$build_status" -eq 0 ]; then
            /tmp/q7306_scan --source-sha256 "$(cat /tmp/q7306-source.sha256)" \
              256 512 1024 2048 \
              > /tmp/q7306-output.json 2> /tmp/q7306-summary.txt
            run_status=$?
          else
            : > /tmp/q7306-output.json
            cp /tmp/q7306-build.log /tmp/q7306-summary.txt
            run_status=125
          fi
          echo "$run_status" > /tmp/q7306-run.status

          if [ "$run_status" -eq 0 ]; then
            jq empty /tmp/q7306-output.json > /tmp/q7306-json.log 2>&1
            json_status=$?
          else
            : > /tmp/q7306-json.log
            json_status=125
          fi
          echo "$json_status" > /tmp/q7306-json.status

          if [ "$json_status" -eq 0 ] \
             && [ "$(cat /tmp/q7306-previous.available)" = 1 ] \
             && [ "$(cat /tmp/q7306-source-changed.status)" = 0 ]; then
            cmp -s /tmp/q7306-previous-output.json /tmp/q7306-output.json
            determinism_status=$?
          else
            determinism_status=125
          fi
          echo "$determinism_status" > /tmp/q7306-determinism.status

          cat > /tmp/q7306-events.jq <<'JQ'
          {
            schema: "q7306-event-catalog-v1",
            source_sha256: .source_sha256,
            scales: [
              .scales[] as $s
              | {
                  X: $s.X,
                  K_histogram: $s.K_histogram,
                  aggregate_invariants: $s.aggregate_invariants,
                  self_checks: $s.self_checks,
                  selected_rows: [
                    $s.rows[] as $r
                    | ([
                        range(0; $r.K) as $i
                        | range(0; $r.K) as $j
                        | select($r.quotient_zero_matrix.values[$i][$j] == 1)
                        | {
                            row_hit_index: $i,
                            column_hit_index: $j,
                            row_prime: $r.hits[$i].p,
                            quotient: $r.hits[$j].q
                          }
                      ]) as $qedges
                    | ([
                        range(0; $r.K) as $i
                        | range(0; $r.K) as $j
                        | select(($i != $j) and
                                 ($r.residue_cross_zero_matrix.values[$i][$j] == 1))
                        | {
                            row_hit_index: $i,
                            column_hit_index: $j,
                            row_prime: $r.hits[$i].p,
                            canonical_residue: $r.hits[$j].rho,
                            same_canonical_digit:
                              ($r.hits[$i].rho == $r.hits[$j].rho)
                          }
                      ]) as $redges
                    | select(
                        ($r.K == 4)
                        or (($qedges | length) > 0)
                        or (($redges | length) > 0)
                        or (($r.typed_projective_state_collisions | length) > 0)
                        or (($r.nonreflection_quotient_generated_extra_returns | length) > 0)
                      )
                    | {
                        n: $r.n,
                        K: $r.K,
                        hits: $r.hits,
                        quotient_zero_edges: $qedges,
                        residue_offdiagonal_edges: $redges,
                        typed_projective_state_collisions:
                          $r.typed_projective_state_collisions,
                        continuant_supports: $r.continuant_supports,
                        nonreflection_quotient_generated_extra_returns:
                          $r.nonreflection_quotient_generated_extra_returns
                      }
                  ]
                }
            ]
          }
          JQ

          if [ "$json_status" -eq 0 ]; then
            jq -S -f /tmp/q7306-events.jq /tmp/q7306-output.json \
              > /tmp/q7306-event-catalog.json 2> /tmp/q7306-events.log
            events_status=$?
          else
            : > /tmp/q7306-event-catalog.json
            : > /tmp/q7306-events.log
            events_status=125
          fi
          echo "$events_status" > /tmp/q7306-events.status

          sha256sum /tmp/q7306-output.json | awk '{print $1}' > /tmp/q7306-output.sha256
          sha256sum /tmp/q7306-event-catalog.json | awk '{print $1}' > /tmp/q7306-event-catalog.sha256
          if [ -s /tmp/q7306-build.log ]; then
            cp /tmp/q7306-build.log /tmp/q7306-build.txt
          else
            echo 'clean: no compiler diagnostics' > /tmp/q7306-build.txt
          fi
          if [ -s /tmp/q7306-json.log ]; then
            cp /tmp/q7306-json.log /tmp/q7306-json-validation.txt
          else
            echo 'PASS: jq parsed output.json' > /tmp/q7306-json-validation.txt
          fi
          if [ -s /tmp/q7306-events.log ]; then
            cp /tmp/q7306-events.log /tmp/q7306-event-extraction.txt
          else
            echo 'PASS: jq produced event-catalog.json' > /tmp/q7306-event-extraction.txt
          fi
          if [ "$determinism_status" -eq 0 ]; then
            echo 'PASS: output.json is byte-identical to the prior finalized-source run' > /tmp/q7306-determinism.txt
          elif [ "$(cat /tmp/q7306-source-changed.status)" = 1 ]; then
            echo 'NOT COMPARABLE: source normalization changed the embedded source hash; rerun required' > /tmp/q7306-determinism.txt
          else
            echo 'FAIL: output.json differs from the prior finalized-source run' > /tmp/q7306-determinism.txt
          fi
          exit 0
      - name: Persist finalized source, exact output, event catalog, and checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout q7306-audit
          mkdir -p problems/3.2/research/q7306
          cp /tmp/q7306_highload_scan.cpp problems/3.2/research/q7306_highload_scan.cpp
          cp /tmp/q7306-output.json problems/3.2/research/q7306/output.json
          cp /tmp/q7306-summary.txt problems/3.2/research/q7306/summary.txt
          cp /tmp/q7306-event-catalog.json problems/3.2/research/q7306/event-catalog.json
          cp /tmp/q7306-build.txt problems/3.2/research/q7306/build.txt
          cp /tmp/q7306-json-validation.txt problems/3.2/research/q7306/json-validation.txt
          cp /tmp/q7306-event-extraction.txt problems/3.2/research/q7306/event-extraction.txt
          cp /tmp/q7306-determinism.txt problems/3.2/research/q7306/determinism.txt
          cp /tmp/q7306-source.sha256 problems/3.2/research/q7306/source.sha256
          cp /tmp/q7306-output.sha256 problems/3.2/research/q7306/output.sha256
          cp /tmp/q7306-event-catalog.sha256 problems/3.2/research/q7306/event-catalog.sha256
          cp /tmp/q7306-source-changed.status problems/3.2/research/q7306/source-changed.status
          cp /tmp/q7306-build.status problems/3.2/research/q7306/build.status
          cp /tmp/q7306-run.status problems/3.2/research/q7306/run.status
          cp /tmp/q7306-json.status problems/3.2/research/q7306/json.status
          cp /tmp/q7306-determinism.status problems/3.2/research/q7306/determinism.status
          cp /tmp/q7306-events.status problems/3.2/research/q7306/events.status
          git add -f problems/3.2/research/q7306_highload_scan.cpp problems/3.2/research/q7306
          git commit -m 'Finalize warning-free Q7306 scanner and exact artifacts' || true
          git push origin HEAD:q7306-audit
      - name: Enforce exact gates
        shell: bash
        run: |
          test "$(cat /tmp/q7306-build.status)" = 0
          test "$(cat /tmp/q7306-run.status)" = 0
          test "$(cat /tmp/q7306-json.status)" = 0
          test "$(cat /tmp/q7306-events.status)" = 0
          if [ "$(cat /tmp/q7306-source-changed.status)" = 0 ]; then
            test "$(cat /tmp/q7306-determinism.status)" = 0
          else
            test "$(cat /tmp/q7306-source-changed.status)" = 1
          fi
# Finalized-source byte determinism rerun.
