name: Q2354 exact resultant audit

on:
  push:
    branches:
      - chatgpt-drop
    paths:
      - '.github/workflows/q2354-resultants.yml'
      - 'problems/3.2/research/scripts/q2354_resultants.gp'

permissions:
  contents: write

jobs:
  exact-resultants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Compute and factor exact resultants
        run: |
          gp -q problems/3.2/research/scripts/q2354_resultants.gp 2>&1 | tee problems/3.2/research/q2354-resultants.txt
      - name: Commit exact transcript to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/3.2/research/q2354-resultants.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Q2354 exact resultant transcript"
            git pull --rebase origin chatgpt-drop
            git push origin HEAD:chatgpt-drop
          fi
      - name: Upload exact transcript
        uses: actions/upload-artifact@v4
        with:
          name: q2354-resultants
          path: problems/3.2/research/q2354-resultants.txt
