name: Q5724 Windows recurrence audit
on:
  push:
    branches: [q5724-audit]
    paths:
      - 'problems/3.2/research/scripts/q5724_minimal_probe.py'
      - '.github/workflows/q5724-windows-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5724_minimal_probe.py'
      - '.github/workflows/q5724-windows-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy sympy
      - run: python problems/3.2/research/scripts/q5724_minimal_probe.py | Tee-Object -FilePath q5724-windows.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q5724-windows-output
          path: q5724-windows.out
          if-no-files-found: error
