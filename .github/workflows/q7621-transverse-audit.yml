name: Q7621 exact transverse scan
on:
  push:
    branches: [q7621-audit-5d638a12]
    paths:
      - '.github/workflows/q7621-transverse-audit.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pari-gp
      - name: Exact scan through r=5000
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/q7621.gp <<'GP'
          default(parisizemax, 2000000000);
          N=5000;
          P(n)=34*n^3+51*n^2+27*n+5;
          b=vector(N+1); b[1]=1; b[2]=5;
          for(n=1,N-1,b[n+2]=(P(n)*b[n+1]-n^3*b[n])/(n+1)^3);
          if(vector(6,k,b[k])!=[1,5,73,1445,33001,819005],error("bad b prefix"));

          x='x; F=Ser(b); Delta=1-34*x+x^2+O(x^(N+1)); S=sqrt(Delta); C=1/(F^2*S);
          g=vector(N+1,k,polcoef(C,k-1));
          if(vector(4,k,g[k])!=[1,7,192,5520],error("bad g prefix"));
          print("CHECK_B=",vector(6,k,b[k]));
          print("CHECK_G=",vector(11,k,g[k]));

          xi=vector(N+1); xi[1]=-1;
          for(r=1,N,xi[r+1]=xi[r]-5*g[r+1]*b[r]);
          print("CHECK_R5=",[b[6]%11,xi[6]%11]);

          d=vector(N,r,gcd(abs(b[r+1]),abs(xi[r+1])));
          inds=vector(N,r,r);
          cand=select(r->d[r]>r,inds);
          print("CAND_COUNT_D_GT_R=",#cand);
          print("CANDIDATES_D_GT_R=",apply(r->[r,d[r],factor(d[r])],cand));

          kap=vector(41); kap[1]=0; kap[2]=-36;
          for(r=2,40,kap[r+1]=(P(r-1)*kap[r]-(r-1)^3*kap[r-1]-5*g[r+1])/r^3);
          dets=vector(40,r,r^3*(b[r]*kap[r+1]-b[r+1]*kap[r]));
          if(select(r->dets[r]!=xi[r+1],vector(40,r,r))!=[],error("determinant identity failure"));
          print("DETERMINANT_IDENTITY_OK_THROUGH_40");
          print("Q7621_AUDIT_SUCCESS");
          quit;
          GP
          gp -fq /tmp/q7621.gp 2>&1 | tee /tmp/q7621.out
          grep -q '^Q7621_AUDIT_SUCCESS$' /tmp/q7621.out
          if grep -Eq 'syntax error|incorrect type|user error|sorry,' /tmp/q7621.out; then exit 1; fi
