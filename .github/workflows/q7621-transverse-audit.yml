name: Q7621 exact transverse scan
on:
  push:
    branches: [q7621-audit-5d638a12]
    paths:
      - '.github/workflows/q7621-transverse-audit.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pari-gp
      - name: Exact scan through r=5000
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/q7621.gp <<'GP'
          default(parisizemax, 2000000000);
          N = 5000;
          P(n) = 34*n^3 + 51*n^2 + 27*n + 5;

          b = vector(N+1);
          b[1] = 1;
          b[2] = 5;
          for(n=1,N-1,{num=P(n)*b[n+1]-n^3*b[n]; den=(n+1)^3; if(num%den,error("nonintegral b recurrence at n=",n)); b[n+2]=num/den;});

          x = 'x;
          F = Ser(b);
          Delta = 1 - 34*x + x^2 + O(x^(N+1));
          S = sqrt(Delta);
          C = 1/(F^2*S);
          g = vector(N+1,k,polcoef(C,k-1));

          if(vector(6,k,b[k]) != [1,5,73,1445,33001,819005], error("bad b prefix"));
          if(vector(4,k,g[k]) != [1,7,192,5520], error("bad g prefix"));
          print("CHECK b[0..5]=",vector(6,k,b[k]));
          print("CHECK g[0..10]=",vector(11,k,g[k]));

          xi=-1;
          pairs=List();
          max_num=0; max_den=1; max_r=0; max_p=0;
          count_gt2=0; count_gt3=0; count_gt4=0; count_gt5=0; count_gt10=0;
          xi5=0; b5=b[6];
          for(r=1,N,{xi-=5*g[r+1]*b[r]; if(r==5,xi5=xi); d=gcd(abs(b[r+1]),abs(xi)); if(d>r,{fac=factor(d); for(i=1,matsize(fac)[1],{pp=fac[i,1]; if(pp>r,{vb=valuation(b[r+1],pp); vx=valuation(xi,pp); listput(pairs,[r,pp,vb,vx,d]); if(pp*max_den>max_num*r,{max_num=pp;max_den=r;max_r=r;max_p=pp;}); if(pp>2*r,count_gt2++); if(pp>3*r,count_gt3++); if(pp>4*r,count_gt4++); if(pp>5*r,count_gt5++); if(pp>10*r,count_gt10++);});});});});

          print("CHECK r=5 b5 mod11=",b5%11," Xi5 mod11=",xi5%11);
          print("PAIR_COUNT=",#pairs);
          lim=min(#pairs,40);
          print("FIRST_PAIRS_BEGIN");
          for(i=1,lim,print(pairs[i]));
          print("FIRST_PAIRS_END");
          if(#pairs>0,print("MAX_RATIO_PAIR=",[max_r,max_p]," ratio=",max_p*1.0/max_r),print("MAX_RATIO_PAIR=none"));
          print("COUNTS_GT_2R_3R_4R_5R_10R=",[count_gt2,count_gt3,count_gt4,count_gt5,count_gt10]);
          small=List();
          for(i=1,#pairs,if(pairs[i][2]<=199,listput(small,pairs[i])));
          print("PAIRS_WITH_P_LE_199=",small);

          kap=vector(41); kap[1]=0; kap[2]=-36;
          for(r=2,40,kap[r+1]=(P(r-1)*kap[r]-(r-1)^3*kap[r-1]-5*g[r+1])/r^3);
          xx=-1;
          for(r=1,40,{xx-=5*g[r+1]*b[r]; det=r^3*(b[r]*kap[r+1]-b[r+1]*kap[r]); if(det!=xx,error("Xi determinant mismatch at r=",r));});
          print("DETERMINANT_IDENTITY_OK_THROUGH_40");
          print("Q7621_AUDIT_SUCCESS");
          quit;
          GP
          gp -fq /tmp/q7621.gp | tee /tmp/q7621.out
          grep -q '^Q7621_AUDIT_SUCCESS$' /tmp/q7621.out
