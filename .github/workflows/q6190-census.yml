name: q6190 finite census

on:
  push:
    branches:
      - q6190-census

concurrency:
  group: q6190-census-scratch
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Structural pair census
        run: |
          set -euxo pipefail
          python3 problems/3.2/q6190_pair_census.py | tee /tmp/q6190_pair.log
          python3 problems/3.2/primitive_chain_census.py | tee /tmp/q6190_primitive.log
      - name: Reflection multiplier regression
        run: |
          set -euxo pipefail
          python3 problems/3.2/bridge_reflection_multiplier_verify.py | tee /tmp/q6190_reflection.log
      - name: Parallel first-Witt and companion census through 1000000
        run: |
          set -euxo pipefail
          cc -O3 -fopenmp -Wall -Wextra -Wpedantic -o /tmp/q6190_witt_parallel problems/3.2/q6190_witt_parallel.c
          OMP_NUM_THREADS=4 /tmp/q6190_witt_parallel 1000000 | tee /tmp/q6190_witt_parallel.log
      - name: Checksums
        run: |
          set -euxo pipefail
          sha256sum \
            problems/3.2/data_zp_pairs.bin \
            problems/3.2/q6190_pair_census.py \
            problems/3.2/q6190_witt_census.c \
            problems/3.2/q6190_witt_parallel.c \
            /tmp/q6190_pair.log \
            /tmp/q6190_primitive.log \
            /tmp/q6190_reflection.log \
            /tmp/q6190_witt_parallel.log
