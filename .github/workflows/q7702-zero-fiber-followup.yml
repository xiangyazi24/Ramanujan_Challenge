    paths:
      - 'problems/3.2/research/scripts/q7702_zero_fiber_followup.sage'
      - '.github/workflows/q7702-zero-fiber-followup.yml'
jobs:
  sage:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
    env:
