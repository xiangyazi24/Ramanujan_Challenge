name: q8043-franel-audit
on:
  push:
    branches:
      - chatgpt-drop
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Canonicalize verifier constants
        shell: bash
        run: |
          sed -i 's/(22312715,1441667719,1397042290)/(22314355,1400240839,1355612130)/' drops/Q8043-f58f62d5-verify.py
          if ! git diff --quiet -- drops/Q8043-f58f62d5-verify.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add drops/Q8043-f58f62d5-verify.py
            git commit -m 'Correct Q8043 exact prefix constants [skip ci]'
            git push origin HEAD:chatgpt-drop
          fi
      - name: Load census input
        run: git checkout origin/main -- problems/3.2/data_zp_pairs.bin
      - name: Run exact verifier
        run: python drops/Q8043-f58f62d5-verify.py --shell-x-max 24
