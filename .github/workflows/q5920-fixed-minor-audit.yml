name: Q5920 fixed-minor exact audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5920_fixed_minor_scan.sage'
      - '.github/workflows/q5920-fixed-minor-audit.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Sage scan in SageMath container
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint bash \
            -v "$PWD":/repo -w /repo \
            sagemath/sagemath:10.5 \
            -lc 'sage -c "from ore_algebra import *" >/dev/null 2>&1 || sage -pip install git+https://github.com/mkauers/ore_algebra.git; sage problems/3.2/research/scripts/q5920_fixed_minor_scan.sage --start=520 --stop=800 --step=20'
