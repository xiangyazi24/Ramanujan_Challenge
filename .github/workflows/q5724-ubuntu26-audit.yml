name: Q5724 Ubuntu 26 recurrence audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: q5724-ubuntu26-recurrence
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare vectorized exact probe
        shell: bash
        run: |
          cp problems/3.2/research/scripts/q5724_minimal_probe.py /tmp/q5724_probe.py
          sed -i 's/MS = (1400, 1600, 1800)/MS = (1050, 1150)/' /tmp/q5724_probe.py
          python -m pip install numpy sympy
      - name: Run exact modular recurrence probe
        shell: bash
        run: python /tmp/q5724_probe.py | tee q5724-ubuntu26.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q5724-ubuntu26-output
          path: q5724-ubuntu26.out
          if-no-files-found: error
