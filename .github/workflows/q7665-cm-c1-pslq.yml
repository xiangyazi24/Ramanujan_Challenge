name: Q7665 CM c1 extrapolation
on:
  push:
    branches: [q7665-audit-33bde4bb]
    paths:
      - '.github/workflows/q7665-cm-c1-pslq.yml'
permissions:
  contents: read
jobs:
  c1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:latest
    steps:
      - name: Extrapolate CM constant and first correction
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/q7665_c1.sage <<'SAGE'
          N = 1800
          P = lambda n: 34*n^3 + 51*n^2 + 27*n + 5
          b = [ZZ(1), ZZ(5)]
          for n in range(1,N):
              b.append((P(n)*b[n]-ZZ(n)^3*b[n-1]) // ZZ(n+1)^3)
          R.<x> = PowerSeriesRing(QQ, default_prec=N+1)
          F = R(sum(QQ(b[n])*x^n for n in range(N+1))).add_bigoh(N+1)
          G = (1/(F^2*(1-34*x+x^2).sqrt())).add_bigoh(N+1)
          g = [ZZ(G[n]) for n in range(N+1)]
          kap=[QQ(0),QQ(-36)]
          for r in range(2,N+1):
              kap.append((P(r-1)*kap[r-1]-ZZ(r-1)^3*kap[r-2]-5*g[r])/ZZ(r)^3)

          RF=RealField(500)
          z3q=sum(QQ(5*(-1)^(k-1))/(2*ZZ(k)^3*binomial(2*k,k)) for k in range(1,360))
          z3=RF(z3q); pi=RF.pi(); p3=pi^3/RF(6).sqrt()
          C=14*z3-RF(20)/9*p3
          ns=[900,1000,1100,1200,1300,1400,1500,1600,1700]

          # Independent fit q_n = C0 + c1/n + ... + c8/n^8.
          A0=matrix(RF, [[RF(1)/RF(n)^j for j in range(9)] for n in ns])
          qv=vector(RF, [RF(kap[n])/RF(b[n]) for n in ns])
          qcoeff=A0.solve_right(qv)
          print('C_FORMULA=',C)
          print('C_INDEPENDENT=',qcoeff[0])
          print('C_DIFF=',qcoeff[0]-C)
          print('C1_INDEPENDENT=',qcoeff[1])

          # More stable c1 fit after subtracting the exact C.
          y=vector(RF, [RF(n)*(RF(kap[n])/RF(b[n])-C) for n in ns])
          coeff=A0.solve_right(y)
          c1=coeff[0]
          print('C1_EXTRAP=',c1)
          print('C2_EXTRAP=',coeff[1])
          print('C3_EXTRAP=',coeff[2])
          for start in [700,800,900]:
              nss=[start+100*j for j in range(9)]
              AA=matrix(RF, [[RF(1)/RF(n)^j for j in range(9)] for n in nss])
              yy=vector(RF,[RF(n)*(RF(kap[n])/RF(b[n])-C) for n in nss])
              cc=AA.solve_right(yy)[0]
              print('C1_WINDOW',start,cc,'diff=',cc-c1)

          # Small-relation probe only; large-coefficient PARI outputs are not theorem evidence.
          bases=[
              ('1,z3,p3', [RF(1),z3,p3,c1]),
              ('1,C,p3', [RF(1),C,p3,c1]),
              ('1,C,z3', [RF(1),C,z3,c1])]
          for name,vals in bases:
              rel=pari(vals).lindep()
              rr=sum(ZZ(rel[i])*vals[i] for i in range(len(vals)))
              print('LINDEP',name,'rel=',rel,'residual=',rr)
          print('Q7665_C1_SUCCESS')
          SAGE
          sage /tmp/q7665_c1.sage 2>&1 | tee /tmp/q7665_c1.out
          grep -q '^Q7665_C1_SUCCESS$' /tmp/q7665_c1.out
