name: Q7702 extension residue probe
on:
  push:
    branches: [q7702-zero-fiber-635f6233]
    paths:
      - 'problems/3.2/research/scripts/q7702_extension_residue_probe.sage'
      - '.github/workflows/q7702-extension-residue.yml'
jobs:
  sage:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
    env:
      Q7702_RESIDUE_PMAX: 5000
      Q7702_ABOVE_COUNT: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run Q7702 extension residue probe
        run: sage problems/3.2/research/scripts/q7702_extension_residue_probe.sage
