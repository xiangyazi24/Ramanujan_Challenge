name: Q4279 analyze 10m scan

on:
  push:
    branches: [chatgpt-drop]
    paths:
      - 'drops/Q4279-53770bd8/results-1000000-10000000/manifest.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Compile and analyze
        shell: bash
        run: |
          set -euo pipefail
          ROOT='drops/Q4279-53770bd8'
          OUT="$ROOT/results-1000000-10000000"
          mkdir -p "$ROOT/build-analysis" "$OUT/analysis-work"
          g++ -O3 -std=c++20 -Wall -Wextra -Wpedantic \
            "$ROOT/q4279_analyze.cpp" -o "$ROOT/build-analysis/q4279_analyze"
          gzip -dc "$OUT/q_stats.csv.gz" > "$OUT/analysis-work/q_stats.csv"
          "$ROOT/build-analysis/q4279_analyze" \
            "$OUT/analysis-work/q_stats.csv" "$OUT/block_stats.csv" "$OUT/trend_analysis"
          rm -rf "$OUT/analysis-work"
          (cd "$OUT" && sha256sum * > SHA256SUMS.new && mv SHA256SUMS.new SHA256SUMS)
      - name: Commit trend analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin chatgpt-drop
          git add drops/Q4279-53770bd8/results-1000000-10000000/trend_analysis.* \
                  drops/Q4279-53770bd8/results-1000000-10000000/SHA256SUMS
          git commit -m 'Q4279 trend analysis for q<=10,000,000 scan'
          git push origin HEAD:chatgpt-drop
