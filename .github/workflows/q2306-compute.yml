name: Q2306 exact F181 resultant

on:
  push:
    branches: [q2306-compute-9a7673b0]
    paths:
      - '.github/workflows/q2306-compute.yml'

permissions:
  contents: write

concurrency:
  group: q2306-exact-f181-resultant
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run exact dependency-free computation
        shell: bash
        run: |
          set -euo pipefail
          python3 problems/3.2/research/scripts/q2306_resultant.py | tee q2306-result.md
          test "$(head -n 1 q2306-result.md)" = "ANSWER Q2306 9a7673b0"
      - name: Persist exact output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q2306-result.md
          git commit -m 'Record Q2306 exact F181 resultant'
          git push origin HEAD:q2306-compute-9a7673b0
