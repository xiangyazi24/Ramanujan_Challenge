name: Q5938 exact Newton conjugation audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/q5938-audit.yml'
      - 'problems/3.2/research/scripts/q5938_newton_conjugation_audit.sage'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic
        shell: bash
        run: |
          echo Q5938_WORKFLOW_DIAGNOSTIC_PASS > q5938-diagnostic.out
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: q5938-diagnostic
          path: q5938-diagnostic.out
