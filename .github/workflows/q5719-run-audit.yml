name: Q5719 common ghost audit runner

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5719_common_ghost_audit.py'
      - '.github/workflows/q5719-common-ghost-audit.yml'

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run geometry audit
        run: python3 problems/3.2/research/scripts/q5719_common_ghost_audit.py --limit 2000 > q5719-geometry.out
      - uses: actions/upload-artifact@v4
        with:
          name: q5719-geometry-output
          path: q5719-geometry.out
          if-no-files-found: error

  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run exact modular audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5719_common_ghost_audit.py --limit 2000 --evaluate > q5719-evaluate.out 2>&1
          echo $? > q5719-evaluate.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q5719-evaluate-output
          path: |
            q5719-evaluate.out
            q5719-evaluate.status
          if-no-files-found: error
