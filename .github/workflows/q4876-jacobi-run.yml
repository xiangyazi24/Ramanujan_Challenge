name: Q4876 Jacobi numerical comparison

on:
  push:
    branches:
      - q4876-jacobi-run
    paths:
      - '.github/workflows/q4876-jacobi-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4876-jacobi-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --upgrade pip mpmath
      - name: Fetch the exact test script
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/xiangyazi24/Shen_work/q4876-jacobi-test/scripts/q4876_jacobi_test.py \
            --output q4876_jacobi_test.py
      - name: Run 120-digit comparison
        run: python q4876_jacobi_test.py | tee q4876_output.txt
      - name: Commit the numerical output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add q4876_output.txt
          git commit -m 'Q4876: record 120-digit Jacobi comparison output [skip ci]'
          git push origin HEAD:q4876-jacobi-run
