name: Q2371 exact affine-split audit

on:
  push:
    branches: [chatgpt-q2371-audit]
    paths:
      - '.github/workflows/q2371-affine-split.yml'
      - 'problems/3.2/research/scripts/q2371_affine_split.gp'
      - 'problems/3.2/research/scripts/q2371_correct_wronskian.gp'

permissions:
  contents: write

concurrency:
  group: q2371-affine-split-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pari-gp
      - name: Run exact audits
        run: |
          gp -q problems/3.2/research/scripts/q2371_affine_split.gp \
            > problems/3.2/research/q2371-affine-split.txt
          gp -q problems/3.2/research/scripts/q2371_correct_wronskian.gp \
            > problems/3.2/research/q2371-correct-wronskian.txt
      - name: Persist transcripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/3.2/research/q2371-affine-split.txt \
                  problems/3.2/research/q2371-correct-wronskian.txt
          git commit -m 'Record Q2371 exact affine-split audit outputs' || exit 0
          git push origin HEAD:chatgpt-q2371-audit
