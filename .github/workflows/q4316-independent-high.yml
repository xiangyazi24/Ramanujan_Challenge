name: Q4316 independent exact census 10000-15000

on:
  push:
    branches:
      - q4316-independent-high
    paths:
      - '.github/workflows/q4316-independent-high.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4316-independent-high
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          set -euo pipefail
          rm -rf scratch/q4316/classes-high scratch/q4316/results-high
          mkdir -p scratch/q4316/classes-high
          javac -Xlint:all -Werror -d scratch/q4316/classes-high \
            scratch/q4313/Q4313IndependentCensus.java \
            scratch/q4316/Q4316CensusAnalysis.java
      - name: Run exact shard
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v java -Xmx12g \
            -cp scratch/q4316/classes-high Q4313IndependentCensus \
            --min-q 10001 --qmax 15000 --prefixes 15000 \
            --out scratch/q4316/results-high \
            > >(tee scratch/q4316/high-stdout.log) \
            2> >(tee scratch/q4316/high-time.log >&2)
          java -cp scratch/q4316/classes-high Q4316CensusAnalysis \
            --records scratch/q4316/results-high/records.tsv \
            --out scratch/q4316/results-high/extension-analysis.md \
            --lo-exclusive 10000 --hi-inclusive 15000 \
            | tee scratch/q4316/high-analysis.log
          (cd scratch/q4316/results-high && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: q4316-independent-high
          path: |
            scratch/q4316/results-high
            scratch/q4316/high-stdout.log
            scratch/q4316/high-time.log
            scratch/q4316/high-analysis.log
          if-no-files-found: error
          retention-days: 90
      - name: Commit outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin q4316-independent-high
          git add scratch/q4316/results-high scratch/q4316/high-*.log
          git commit -m 'Q4316 exact census shard 10000-15000'
          git push origin HEAD:q4316-independent-high
