name: Q7265 exact p<=200 audit
on:
  push:
    branches: [q7265-compute]
    paths:
      - '.github/workflows/q7265-compute.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact recurrence and binomial cross-check
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from math import comb, isqrt

          def primes_up_to(limit):
              sieve = bytearray(b'\x01') * (limit + 1)
              sieve[:2] = b'\x00\x00'
              for d in range(2, isqrt(limit) + 1):
                  if sieve[d]:
                      start = d * d
                      sieve[start:limit + 1:d] = b'\x00' * ((limit - start) // d + 1)
              return [n for n, flag in enumerate(sieve) if flag]

          def recurrence_zero_set(p):
              previous, current = 1 % p, 5 % p
              zeros = []
              if previous == 0:
                  zeros.append(0)
              if current == 0:
                  zeros.append(1)
              for n in range(1, p - 1):
                  P = (34*n**3 + 51*n**2 + 27*n + 5) % p
                  following = (P*current - pow(n, 6, p)*previous) % p
                  previous, current = current, following
                  if current == 0:
                      zeros.append(n + 1)
              return tuple(zeros)

          def apery_mod(n, p):
              return sum((comb(n,k) * comb(n+k,k))**2 for k in range(n + 1)) % p

          rows = []
          for p in primes_up_to(200):
              if p == 2:
                  continue
              zr = recurrence_zero_set(p)
              zd = tuple(n for n in range(p) if apery_mod(n,p) == 0)
              assert zr == zd, (p, zr, zd)
              assert all(p - 1 - n in zr for n in zr), (p, zr)
              assert all(n + 1 not in zr for n in zr), (p, zr)
              rows.append((p,zr))
              print(f'Q7265_ROW p={p} Z={list(zr)} count={len(zr)}')

          active = [(p,z) for p,z in rows if z]
          histogram = Counter(len(z) for _,z in rows)
          print('Q7265_ACTIVE ' + '; '.join(f'{p}:{list(z)}' for p,z in active))
          print('Q7265_HIST ' + ' '.join(f'{k}:{histogram[k]}' for k in sorted(histogram)))
          print(f'Q7265_SUMMARY primes={len(rows)} active={len(active)} maxZ={max(len(z) for _,z in rows)}')

          for p in (11,13):
              residues = [((comb(5,k)*comb(5+k,k))**2) % p for k in range(6)]
              print(f'Q7265_PATTERN p={p} j=5 valuations={[0]*6} residues={residues} sum_mod_p={sum(residues)%p}')

          b5 = sum((comb(5,k)*comb(5+k,k))**2 for k in range(6))
          q, v = b5, 0
          while q % 11 == 0:
              q //= 11
              v += 1
          print(f'Q7265_B5 b5={b5} v11={v} mod13={b5%13}')
          PY
