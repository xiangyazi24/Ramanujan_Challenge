name: Q6383 pole-block Lean gate

on:
  push:
    branches: [q6383-pole-block-0445261f]
    paths:
      - 'lean/RamanujanChallenge/Problem27PoleBlockScratch.lean'
      - '.github/workflows/q6383-pole-block.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact module
        shell: bash
        run: |
          set +e
          cd lean
          lake exe cache get 2>&1 | tee ../q6383-cache.out
          cache_status=${PIPESTATUS[0]}
          lake build RamanujanChallenge.Problem27PoleBlockScratch 2>&1 | tee ../q6383-build.out
          build_status=${PIPESTATUS[0]}
          cd ..
          printf 'cache_status=%s\nbuild_status=%s\n' "$cache_status" "$build_status" | tee q6383-status.out
          exit 0
      - name: Persist compiler output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q6383-cache.out q6383-build.out q6383-status.out
          git commit -m 'Q6383: record Lean compile output' || exit 0
          git push origin HEAD:q6383-pole-block-0445261f
