name: Q5719 common ghost audit

on:
  push:
    branches: [q5719-audit]
    paths:
      - 'problems/3.2/research/scripts/q5719_common_ghost_audit.py'
      - '.github/workflows/q5719-common-ghost-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q5719-audit
          fetch-depth: 0
      - name: Run geometry audit
        run: python3 problems/3.2/research/scripts/q5719_common_ghost_audit.py --limit 2000 > q5719-geometry.out
      - name: Run exact modular audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5719_common_ghost_audit.py --limit 2000 --evaluate > q5719-evaluate.out 2>&1
          echo $? > q5719-evaluate.status
          exit 0
      - name: Persist exact outputs
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5719-geometry.out q5719-evaluate.out q5719-evaluate.status
          git commit -m 'Record Q5719 common-ghost audit outputs' || exit 0
          git push origin HEAD:q5719-audit
