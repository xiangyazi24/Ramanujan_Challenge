name: Q5711 chatgpt-drop first-cell audit

on:
  push:
    branches: [chatgpt-drop]
    paths:
      - 'problems/3.2/research/scripts/q5711_first_cell_audit.py'
      - '.github/workflows/q5711-chatgpt-drop-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Run exact standard-library audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5711_first_cell_audit.py > q5711-audit.out 2>&1
          echo $? > q5711-audit.status
          exit 0
      - name: Persist output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5711-audit.out q5711-audit.status
          git commit -m 'Record Q5711 first-cell audit output' || exit 0
          git push origin HEAD:chatgpt-drop
