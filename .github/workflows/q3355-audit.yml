name: Q3355 corrected projective digit audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q3355_projective_digit_audit.py'
      - '.github/workflows/q3355-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q3355-audit
          fetch-depth: 0
      - name: Run corrected audit
        shell: bash
        run: |
          python3 problems/3.2/research/scripts/q3355_projective_digit_audit.py | tee q3355-audit.out
      - name: Persist output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q3355-audit.out
          git commit -m 'Record Q3355 audit output' || exit 0
          git push origin HEAD:q3355-audit
