name: Q3355 corrected projective digit audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q3355_projective_digit_audit.py'
      - '.github/workflows/q3355-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected audit
        shell: bash
        run: |
          python3 problems/3.2/research/scripts/q3355_projective_digit_audit.py | tee q3355-audit.out
      - uses: actions/upload-artifact@v4
        with:
          name: q3355-audit-output
          path: q3355-audit.out
