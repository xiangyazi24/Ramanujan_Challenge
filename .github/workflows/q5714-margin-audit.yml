name: Q5714 pair-preserving margin audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5714_margin_audit.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run exact standard-library audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5714_margin_audit.py > q5714-audit.out 2>&1
          echo $? > q5714-audit.status
          exit 0
      - name: Persist exact output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5714-audit.out q5714-audit.status
          git commit -m 'Record Q5714 margin audit output' || exit 0
          git push origin HEAD:${{ github.head_ref }}
