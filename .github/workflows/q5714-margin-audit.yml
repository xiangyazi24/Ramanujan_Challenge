name: Q5714 pair-preserving margin audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5714_margin_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run exact standard-library audit
        shell: bash
        run: |
          python3 problems/3.2/research/scripts/q5714_margin_audit.py
