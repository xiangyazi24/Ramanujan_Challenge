name: Q5714 pair-preserving margin audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5714_margin_audit.py'
      - 'problems/3.2/research/scripts/q5714_margin_audit_trigger.py'
      - 'problems/3.2/research/scripts/q5714_margin_audit_trigger2.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run exact standard-library audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5714_margin_audit.py > q5714-audit.out 2>&1
          echo $? > q5714-audit.status
          exit 0
      - name: Upload exact output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q5714-audit-output
          path: |
            q5714-audit.out
            q5714-audit.status
          if-no-files-found: error
