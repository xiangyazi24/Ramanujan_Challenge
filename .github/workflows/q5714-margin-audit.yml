name: Q5714 pair-preserving margin audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5714-margin-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch isolated Q5714 audit
        shell: bash
        run: |
          git fetch origin q5714-audit-d816e1d2
          git show origin/q5714-audit-d816e1d2:problems/3.2/research/scripts/q5714_margin_audit.py > /tmp/q5714_margin_audit.py
      - name: Run exact standard-library audit
        shell: bash
        run: |
          set +e
          python3 /tmp/q5714_margin_audit.py > q5714-audit.out 2>&1
          echo $? > q5714-audit.status
          exit 0
      - name: Persist exact output on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5714-audit.out q5714-audit.status
          git commit -m 'Record Q5714 margin audit output' || exit 0
          git push origin HEAD:main
