name: Q5708 temporary main audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5708-main-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5708_newton_residual_audit.py'
      - '.github/workflows/q5708-chatgpt-drop-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Install exact factoring support
        run: python3 -m pip install --quiet sympy
      - name: Run exact audit
        shell: bash
        run: |
          set +e
          python3 problems/3.2/research/scripts/q5708_newton_residual_audit.py > q5708-audit.out 2>&1
          echo $? > q5708-audit.status
          exit 0
      - name: Persist output on chatgpt-drop
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add q5708-audit.out q5708-audit.status
          git commit -m 'Record Q5708 Newton residual audit' || exit 0
          git push origin HEAD:chatgpt-drop
