name: Q4316 independent exact census 15000-20000

on:
  push:
    branches:
      - q4316-independent-extra
    paths:
      - '.github/workflows/q4316-independent-extra.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4316-independent-extra
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          set -euo pipefail
          rm -rf scratch/q4316/classes-extra scratch/q4316/results-extra
          mkdir -p scratch/q4316/classes-extra
          javac -Xlint:all -Werror -d scratch/q4316/classes-extra \
            scratch/q4313/Q4313IndependentCensus.java \
            scratch/q4316/Q4316CensusAnalysis.java
      - name: Run exact extension
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v java -Xmx12g \
            -cp scratch/q4316/classes-extra Q4313IndependentCensus \
            --min-q 15001 --qmax 20000 --prefixes 20000 \
            --out scratch/q4316/results-extra \
            > >(tee scratch/q4316/extra-stdout.log) \
            2> >(tee scratch/q4316/extra-time.log >&2)
          java -cp scratch/q4316/classes-extra Q4316CensusAnalysis \
            --records scratch/q4316/results-extra/records.tsv \
            --out scratch/q4316/results-extra/extension-analysis.md \
            --lo-exclusive 15000 --hi-inclusive 20000 \
            | tee scratch/q4316/extra-analysis.log
          (cd scratch/q4316/results-extra && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: q4316-independent-extra
          path: |
            scratch/q4316/results-extra
            scratch/q4316/extra-stdout.log
            scratch/q4316/extra-time.log
            scratch/q4316/extra-analysis.log
          if-no-files-found: error
          retention-days: 90
      - name: Commit outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin q4316-independent-extra
          git add -f scratch/q4316/results-extra scratch/q4316/extra-*.log
          git commit -m 'Q4316 exact census extension 15000-20000'
          git push origin HEAD:q4316-independent-extra
