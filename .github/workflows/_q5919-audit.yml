name: Q5919 temporary higher-Cartier audit
on:
  push:
    branches: [chatgpt-drop]
    paths:
      - '.github/workflows/_q5919-audit.yml'
      - 'drops/_q5919_audit.py'
permissions:
  contents: write
concurrency:
  group: q5919-temporary-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Run exact audit
        shell: bash
        run: |
          set -o pipefail
          python drops/_q5919_audit.py | tee /tmp/q5919-audit.out
      - name: Persist output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/q5919-audit.out drops/_q5919_audit.out
          git add drops/_q5919_audit.out
          git commit -m 'Record Q5919 higher-Cartier audit output' || exit 0
          git push origin HEAD:chatgpt-drop
