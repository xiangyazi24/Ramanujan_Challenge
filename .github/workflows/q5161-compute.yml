name: Q5161 exact computation

on:
  pull_request_target:
    branches:
      - chatgpt-compute-q5161-base
    types: [opened, synchronize, reopened]

concurrency:
  group: q5161-trusted-target-computation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-compute-q5161-base
      - name: Run Sage exact arithmetic
        run: |
          docker run --rm -v "$PWD:/work" -w /work sagemath/sagemath:latest sage compute/q5161.sage
      - name: Print generated report
        run: cat compute/q5161-results.md
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: q5161-results
          path: compute/q5161-results.md
