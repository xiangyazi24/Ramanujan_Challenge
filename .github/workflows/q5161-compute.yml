name: Q5161 exact computation

on:
  pull_request:
    branches:
      - chatgpt-compute-q5161-base
    paths:
      - compute/q5161.sage
      - compute/q5161-trigger.txt
      - .github/workflows/q5161-compute.yml

concurrency:
  group: q5161-trusted-base-computation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run Sage exact arithmetic
        run: |
          docker run --rm -v "$PWD:/work" -w /work sagemath/sagemath:latest sage compute/q5161.sage
      - name: Print generated report
        run: cat compute/q5161-results.md
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: q5161-results
          path: compute/q5161-results.md
