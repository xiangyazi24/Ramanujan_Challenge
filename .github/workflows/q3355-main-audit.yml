name: Q3355 temporary main audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q3355-main-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch isolated audit script
        shell: bash
        run: |
          git fetch origin q3355-audit
          git show origin/q3355-audit:problems/3.2/research/scripts/q3355_projective_digit_audit.py > /tmp/q3355_audit.py
      - name: Run and capture output
        shell: bash
        run: |
          set +e
          python3 /tmp/q3355_audit.py > q3355-audit.out 2>&1
          echo $? > q3355-audit.status
          exit 0
      - name: Persist output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q3355-audit.out q3355-audit.status
          git commit -m 'Record Q3355 corrected audit output' || exit 0
          git push origin HEAD:main
