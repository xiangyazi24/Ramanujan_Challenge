name: Q3269 temporary audit runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/q3269-run-audit-temporary.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Run Q3228 audit
        run: |
          python3 chatgpt-drop/Q3269_q3228_audit.py > chatgpt-drop/Q3269_q3228_audit.out 2>&1
      - name: Commit audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-drop/Q3269_q3228_audit.out
          git commit -m 'Record Q3228 audit output for Q3269' || exit 0
          git push origin HEAD:chatgpt-drop
