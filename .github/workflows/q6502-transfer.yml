name: Q6502 harmonic transfer audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'lean/RamanujanChallenge/Q6502Transfer.lean'
      - 'lean/RamanujanChallenge/Q6502Arithmetic.lean'
      - '.github/workflows/q6502-transfer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6502-audit-cd4797bb
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile harmonic transfer
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake exe cache get
          lake build RamanujanChallenge.Q6502Arithmetic
