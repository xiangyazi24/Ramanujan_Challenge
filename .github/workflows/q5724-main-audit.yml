name: Q5724 temporary main audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q2328_associated_resultant_scan.py'
      - '.github/workflows/q2328-scan.yml'
permissions:
  contents: read
concurrency:
  group: q2328-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Q2328 exact scanner
        shell: bash
        run: python3 problems/3.2/research/scripts/q2328_associated_resultant_scan.py
