name: Q5724 temporary main audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5724-main-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch isolated Q5724 probe
        shell: bash
        run: |
          git fetch origin q5724-audit
          git show origin/q5724-audit:problems/3.2/research/scripts/q5724_minimal_probe.sage > /tmp/q5724_probe.sage
      - name: Run Sage probe
        shell: bash
        run: |
          set +e
          docker run --rm -v /tmp:/work -w /work sagemath/sagemath:latest sage q5724_probe.sage > /tmp/q5724-audit.out 2>&1
          echo $? > /tmp/q5724-audit.status
          exit 0
      - name: Persist output on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout q5724-audit
          cp /tmp/q5724-audit.out q5724-audit.out
          cp /tmp/q5724-audit.status q5724-audit.status
          git add q5724-audit.out q5724-audit.status
          git commit -m 'Record Q5724 minimal recurrence probe output' || exit 0
          git push origin HEAD:q5724-audit
