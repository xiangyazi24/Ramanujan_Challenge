name: Q5724 temporary main audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5724-main-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch dependency-free recurrence probe
        shell: bash
        run: |
          git fetch origin q5723-audit
          git show origin/q5723-audit:problems/3.2/research/scripts/q5723_state_order_audit.py > /tmp/q5724_probe.py
          sed -i 's/MODS=(1000000007,1000000009)/MODS=(1000000007,)/' /tmp/q5724_probe.py
          sed -i 's/for M in (754,1200,1500):/for M in (754,900,1050):/' /tmp/q5724_probe.py
      - name: Run exact modular probe
        shell: bash
        run: |
          set +e
          python /tmp/q5724_probe.py > /tmp/q5724-audit.out 2>&1
          echo $? > /tmp/q5724-audit.status
          exit 0
      - name: Persist output on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout q5724-audit
          cp /tmp/q5724-audit.out q5724-audit.out
          cp /tmp/q5724-audit.status q5724-audit.status
          git add q5724-audit.out q5724-audit.status
          git commit -m 'Record Q5724 dependency-free recurrence probe output' || exit 0
          git push origin HEAD:q5724-audit
