name: Q5724 temporary main audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5724-main-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch isolated Q5724 probe
        shell: bash
        run: |
          git fetch origin q5724-audit
          git show origin/q5724-audit:problems/3.2/research/scripts/q5724_minimal_probe.py > /tmp/q5724_probe.py
          sed -i 's/MS = (1400, 1600, 1800)/MS = (950, 1050, 1150)/' /tmp/q5724_probe.py
      - name: Run exact modular probe
        shell: bash
        run: |
          set +e
          python -m pip install numpy sympy > /tmp/q5724-install.out 2>&1
          python /tmp/q5724_probe.py > /tmp/q5724-audit.out 2>&1
          echo $? > /tmp/q5724-audit.status
          exit 0
      - name: Persist output on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout q5724-audit
          cp /tmp/q5724-audit.out q5724-audit.out
          cp /tmp/q5724-audit.status q5724-audit.status
          cp /tmp/q5724-install.out q5724-install.out
          git add q5724-audit.out q5724-audit.status q5724-install.out
          git commit -m 'Record Q5724 minimal recurrence probe output' || exit 0
          git push origin HEAD:q5724-audit
