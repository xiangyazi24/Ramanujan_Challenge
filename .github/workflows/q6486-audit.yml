name: Q6486 final P2.7 closure audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'lean/RamanujanChallenge/Q6486Audit.lean'
      - '.github/workflows/q6486-audit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Audit final closure
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake exe cache get
          lake build RamanujanChallenge.Q6486Audit
