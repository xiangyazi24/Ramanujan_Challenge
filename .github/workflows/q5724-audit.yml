name: Q5724 minimal recurrence audit
on:
  push:
    branches: [q5724-audit]
    paths:
      - 'problems/3.2/research/scripts/q5724_minimal_probe.sage'
      - '.github/workflows/q5724-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5724_minimal_probe.sage'
      - '.github/workflows/q5724-audit.yml'
permissions:
  contents: read
concurrency:
  group: q5724-minimal-recurrence
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run Sage probe in official container
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work sagemath/sagemath:latest \
            sage problems/3.2/research/scripts/q5724_minimal_probe.sage | tee q5724-audit.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q5724-audit-output
          path: q5724-audit.out
          if-no-files-found: error
