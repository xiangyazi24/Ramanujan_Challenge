name: Q7694 temporary exact audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q7694-temp-audit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free Q7694 verifier
        run: python problems/3.2/research/scripts/q7694_scale_sensitive_crossrow_verify.py --N 520
