name: Q5919 higher-Cartier audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/q5919-audit.yml'
      - 'problems/3.2/research/scripts/q5919_higher_cartier_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Q5919 exact audit
        run: python problems/3.2/research/scripts/q5919_higher_cartier_audit.py
