name: Q2373 exact U-V audit

on:
  push:
    branches:
      - chatgpt-drop
    paths:
      - '.github/workflows/q2373-uv-audit.yml'
      - 'problems/3.2/research/scripts/q2373_uv_audit.gp'

permissions:
  contents: write

concurrency:
  group: q2373-uv-audit
  cancel-in-progress: true

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Run exact symbolic and finite-field audit
        run: |
          gp -q problems/3.2/research/scripts/q2373_uv_audit.gp 2>&1 \
            | tee problems/3.2/research/q2373-uv-audit.txt
      - name: Persist transcript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/3.2/research/q2373-uv-audit.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Q2373 exact U-V audit transcript'
            git pull --rebase origin chatgpt-drop
            git push origin HEAD:chatgpt-drop
          fi
