name: Q2373 exact U-V audit

on:
  push:
    branches:
      - chatgpt-q2373-audit
    paths:
      - '.github/workflows/q2373-uv-audit.yml'
      - 'problems/3.2/research/scripts/q2373_uv_audit.gp'

permissions:
  contents: write

concurrency:
  group: q2373-uv-audit
  cancel-in-progress: true

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-q2373-audit
          fetch-depth: 0
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Run exact symbolic and finite-field audit
        run: |
          gp -q problems/3.2/research/scripts/q2373_uv_audit.gp \
            > problems/3.2/research/q2373-uv-audit.txt 2>&1
      - name: Persist transcript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/3.2/research/q2373-uv-audit.txt
          git commit -m 'Record Q2373 exact U-V audit transcript'
          git push origin HEAD:chatgpt-q2373-audit
