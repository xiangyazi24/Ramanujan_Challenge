name: Q7124 temporary source-commit audit runner
on:
  push:
    branches: [chatgpt-drop]
    paths:
      - '.github/workflows/q7124-temp-run.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize data at audited commit
        shell: bash
        run: |
          git fetch --depth=1 origin 6ba7ed097a2f6823e873f7a62904189a526b24ec
          mkdir -p problems/3.2
          git show 6ba7ed097a2f6823e873f7a62904189a526b24ec:problems/3.2/data_zp_pairs.bin > problems/3.2/data_zp_pairs.bin
      - name: Extract, extend, and run the pinned audit program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/q7124-temp-audit.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          lines = src[start:end].splitlines()
          assert all((not line) or line.startswith('          ') for line in lines)
          code = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          extra = r'''
          outside_primes = sorted({r[0] for r in outside_rows})
          print(f'failure_outside_U_H_distinct_primes={len(outside_primes)}')
          print(f'failure_outside_U_H_count_by_Z={dict(sorted(Counter(r[1] for r in outside_rows).items()))}')
          print(f'failure_outside_U_H_prime_count_by_Z={dict(sorted(Counter(len(zeros[p]) for p in outside_primes).items()))}')
          print(f'failure_carrier_reason_counts={dict(sorted(Counter((r[16], r[17]) for r in fail_rows).items()))}')
          print(f'outside_U_H_primes={outside_primes}')

          def direct_zero_set(p):
              vals = [1 % p, 5 % p]
              for m in range(1, p - 1):
                  pm = (34*m**3 + 51*m**2 + 27*m + 5) % p
                  vals.append((pm*vals[-1] - pow(m, 6, p)*vals[-2]) % p)
              assert len(vals) == p
              return [i for i, v in enumerate(vals) if v == 0]

          def Pmod(n, p):
              return (34*n**3 + 51*n**2 + 27*n + 5) % p

          def N_eval(h, x, p):
              assert h >= 1
              if h == 1:
                  return 1 % p
              nm1 = 1 % p
              ncur = Pmod(x + 1, p)
              if h == 2:
                  return ncur
              for k in range(2, h):
                  y = (x + k) % p
                  nxt = (Pmod(x + k, p)*ncur - pow(y, 6, p)*nm1) % p
                  nm1, ncur = ncur, nxt
              return ncur

          for check_p in (smallest_p, first_out[0]):
              direct = direct_zero_set(check_p)
              assert direct == zeros[check_p]
              print(f'direct_recurrence_zero_set_p_{check_p}={direct}')

          p0 = first_out[0]
          outside_at_p0 = [r for r in outside_rows if r[0] == p0]
          print(f'smallest_outside_prime_all_failure_windows={outside_at_p0}')
          for rr in outside_at_p0:
              z0,z1,z2,z3 = rr[3:7]
              a,b,c = rr[7:10]
              raw_adj = [N_eval(a,z0,p0), N_eval(b,z1,p0), N_eval(c,z2,p0)]
              factors = [(2*z0+a+1)%p0, (2*z1+b+1)%p0, (2*z2+c+1)%p0]
              assert raw_adj == [0,0,0]
              assert all(factors)
              deflated_adj = [raw_adj[j] * pow(factors[j], -1, p0) % p0 if (a,b,c)[j] % 2 == 0 else raw_adj[j] for j in range(3)]
              assert deflated_adj == [0,0,0]
              skip = N_eval(b+c,z1,p0)
              assert skip == 0
              print(f'outside_window_start_{rr[2]}_pair_sums={[z0+z1,z1+z2,z2+z3]}')
              print(f'outside_window_start_{rr[2]}_central_factors={factors}')
              print(f'outside_window_start_{rr[2]}_raw_adjacent_N={raw_adj}')
              print(f'outside_window_start_{rr[2]}_deflated_adjacent_Ncirc={deflated_adj}')
              print(f'outside_window_start_{rr[2]}_aligned_skip_N_b_plus_c={skip}')

          # Direct minimal-carrier check at the smallest outside-carrier witness.
          H0 = first_out[10]
          assert H0 < p0
          assert not any(z <= H0 for z in zeros[p0])
          v_prev, v_cur = 0, 1
          v_zeros = []
          for n in range(1, H0 + 1):
              v_prev, v_cur = v_cur, (34*v_cur - v_prev) % p0
              if v_cur == 0:
                  v_zeros.append(n + 1)
          assert not v_zeros
          print(f'smallest_outside_H={H0}')
          print(f'smallest_outside_b_carrier_zero_times_le_H={[]}')
          print(f'smallest_outside_V_carrier_zero_indices_le_H_plus_1={v_zeros}')
          '''
          needle = "print('Q7124_AUDIT_END')"
          assert code.count(needle) == 1
          code = code.replace(needle, extra + "\n" + needle)
          Path('/tmp/q7124_audit.py').write_text(code)
          PY
          python3 /tmp/q7124_audit.py
