name: Q4313 independent fixed-gcd census q20000

on:
  push:
    branches: [q4313-independent-compute]
    paths:
      - '.github/workflows/q4313-independent-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4313-independent-compute
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact standard-library implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/q4313/classes scratch/q4313/results-q20000
          rm -f scratch/q4313/q20000-stdout.log scratch/q4313/q20000-time.log
          mkdir -p scratch/q4313/classes
          javac -Xlint:all -Werror \
            -d scratch/q4313/classes \
            scratch/q4313/Q4313IndependentCensus.java
      - name: Run exact census through q=20000
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v java -Xmx12g \
            -cp scratch/q4313/classes Q4313IndependentCensus \
            --min-q 17 \
            --qmax 20000 \
            --prefixes 10000,15000,20000 \
            --out scratch/q4313/results-q20000 \
            > >(tee scratch/q4313/q20000-stdout.log) \
            2> >(tee scratch/q4313/q20000-time.log >&2)
          (cd scratch/q4313/results-q20000 && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: q4313-independent-q20000
          path: |
            scratch/q4313/results-q20000
            scratch/q4313/q20000-stdout.log
            scratch/q4313/q20000-time.log
          if-no-files-found: error
          retention-days: 90
      - name: Commit exact outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin q4313-independent-compute
          git add scratch/q4313/results-q20000 \
                  scratch/q4313/q20000-stdout.log \
                  scratch/q4313/q20000-time.log
          git commit -m 'Q4313 independent exact census through q=20000'
          git push origin HEAD:q4313-independent-compute
