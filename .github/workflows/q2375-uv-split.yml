name: Q2375 exact U-V split audit

on:
  push:
    branches:
      - chatgpt-drop
    paths:
      - '.github/workflows/q2375-uv-split.yml'
      - 'problems/3.2/research/scripts/q2375_uv_split.gp'

permissions:
  contents: write

jobs:
  exact-uv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Compute exact expansions and factorizations
        run: |
          gp -q problems/3.2/research/scripts/q2375_uv_split.gp 2>&1 | tee problems/3.2/research/q2375-uv-split.txt
      - name: Commit exact transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/3.2/research/q2375-uv-split.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Q2375 exact U-V split transcript"
            git pull --rebase origin chatgpt-drop
            git push origin HEAD:chatgpt-drop
          fi
