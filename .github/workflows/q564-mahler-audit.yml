name: Q564 Mahler coefficient audit

on:
  push:
    branches: [chatgpt-drop]
    paths:
      - '.github/workflows/q564-mahler-audit.yml'

permissions:
  contents: write

concurrency:
  group: q564-mahler-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0

      - name: Compute exact Mahler coefficients and mod-p-squared Newton data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import json
          from pathlib import Path

          OUT = Path('drops')
          OUT.mkdir(parents=True, exist_ok=True)
          PMIN, PMAX = 11, 101

          def is_prime(n: int) -> bool:
              if n < 2:
                  return False
              if n % 2 == 0:
                  return n == 2
              d = 3
              while d * d <= n:
                  if n % d == 0:
                      return False
                  d += 2
              return True

          primes = [p for p in range(PMIN, PMAX + 1) if is_prime(p)]

          # Exact Apéry numbers through b_100 from the integer recurrence.
          b = [1, 5]
          for n in range(1, PMAX):
              Pn = 34*n**3 + 51*n**2 + 27*n + 5
              numerator = Pn*b[n] - n**3*b[n-1]
              denominator = (n+1)**3
              assert numerator % denominator == 0
              b.append(numerator // denominator)
          assert len(b) >= PMAX + 1

          # Exact global Mahler coefficients c_k = Delta^k b_0.
          row = b[:PMAX]
          mahler_exact = []
          while row:
              mahler_exact.append(row[0])
              row = [row[i+1] - row[i] for i in range(len(row)-1)]

          def vp_exact(x: int, p: int) -> int:
              if x == 0:
                  return 10**9
              x = abs(x)
              v = 0
              while x % p == 0:
                  x //= p
                  v += 1
              return v

          def vp_mod_p2(x: int, p: int) -> str:
              q = p*p
              x %= q
              if x % p:
                  return '0'
              if x:
                  return '1'
              return '>=2'

          def power_coefficients_mod_p2(cvals: list[int], p: int) -> list[int]:
              """Convert sum c_k binom(s,k) to ordinary powers modulo p^2."""
              q = p*p
              deg = len(cvals)-1
              ans = [0]*(deg+1)
              falling = [1]  # s^{underline 0}
              fact = 1
              for k, ck in enumerate(cvals):
                  if k > 0:
                      fact = fact*k % q
                  inv_fact = pow(fact, -1, q)
                  scalar = (ck % q)*inv_fact % q
                  for j, coeff in enumerate(falling):
                      ans[j] = (ans[j] + scalar*coeff) % q
                  # falling <- falling*(s-k)
                  nxt = [0]*(len(falling)+1)
                  for j, coeff in enumerate(falling):
                      nxt[j] = (nxt[j] - k*coeff) % q
                      nxt[j+1] = (nxt[j+1] + coeff) % q
                  falling = nxt
              return ans

          records = []
          detail = {}
          for p in primes:
              q = p*p
              ncoeff = p-1  # k=0,...,p-2
              cvals = mahler_exact[:ncoeff]
              cv = [vp_exact(x,p) for x in cvals]
              cmod = [x % q for x in cvals]
              power = power_coefficients_mod_p2(cvals, p)
              pv = [0 if x % p else (1 if x % q else 2) for x in power]

              z = [r for r in range(p) if b[r] % p == 0]
              c_units = sum(v == 0 for v in cv)
              c_v1 = sum(v == 1 for v in cv)
              c_vge2 = sum(v >= 2 for v in cv)
              a_units = sum(v == 0 for v in pv)
              a_v1 = sum(v == 1 for v in pv)
              a_vge2 = sum(v >= 2 for v in pv)
              last_c_unit = max(i for i,v in enumerate(cv) if v == 0)
              last_a_unit = max(i for i,v in enumerate(pv) if v == 0)
              nonunit_c = [i for i,v in enumerate(cv) if v > 0]
              nonunit_a = [i for i,v in enumerate(pv) if v > 0]

              records.append({
                  'p': p,
                  'Zp': len(z),
                  'zero_indices': ';'.join(map(str,z)),
                  'degree': p-2,
                  'mahler_units': c_units,
                  'mahler_v1': c_v1,
                  'mahler_vge2': c_vge2,
                  'mahler_last_unit': last_c_unit,
                  'v_p(c_top)': cv[-1],
                  'mahler_nonunit_indices': ';'.join(map(str,nonunit_c)),
                  'power_units': a_units,
                  'power_v1': a_v1,
                  'power_vge2': a_vge2,
                  'strassmann_index': last_a_unit,
                  'v_p(a_top)_trunc': pv[-1] if pv[-1] < 2 else '>=2',
                  'power_nonunit_indices': ';'.join(map(str,nonunit_a)),
              })
              detail[str(p)] = {
                  'zeros': z,
                  'c_mod_p2': cmod,
                  'c_vp_exact': [('inf' if v >= 10**8 else v) for v in cv],
                  'ordinary_power_mod_p2': power,
                  'ordinary_power_vp_truncated': [('>=2' if v == 2 else v) for v in pv],
              }

          csv_path = OUT/'Q564-mahler-audit.csv'
          with csv_path.open('w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=list(records[0]))
              w.writeheader()
              w.writerows(records)

          json_path = OUT/'Q564-mahler-audit.json'
          json_path.write_text(json.dumps(detail, indent=2) + '\n')

          # Human-readable report, including aggregate diagnostics.
          total = sum(r['degree']+1 for r in records)
          unit_c = sum(r['mahler_units'] for r in records)
          unit_a = sum(r['power_units'] for r in records)
          top_unit_count = sum(r['v_p(c_top)'] == 0 for r in records)
          full_strassmann_count = sum(r['strassmann_index'] == r['degree'] for r in records)
          lines = [
              '# Q564 computation audit',
              '',
              f'Primes: {len(primes)} ({primes[0]} through {primes[-1]}).',
              f'Coefficient-prime pairs: {total}.',
              f'Mahler units: {unit_c}/{total} ({unit_c/total:.4%}).',
              f'Ordinary-power units: {unit_a}/{total} ({unit_a/total:.4%}).',
              f'Top Mahler coefficient is a unit: {top_unit_count}/{len(primes)} primes.',
              f'Strassmann index equals full degree p-2: {full_strassmann_count}/{len(primes)} primes.',
              '',
              '| p | |Z_p| | deg | Mahler units | v_p(c_top) | nonunit c_k | power units | Strassmann index | nonunit power coeffs |',
              '|---:|---:|---:|---:|---:|:---|---:|---:|:---|',
          ]
          for r in records:
              lines.append(
                  f"| {r['p']} | {r['Zp']} | {r['degree']} | {r['mahler_units']} | "
                  f"{r['v_p(c_top)']} | {r['mahler_nonunit_indices'] or 'none'} | "
                  f"{r['power_units']} | {r['strassmann_index']} | "
                  f"{r['power_nonunit_indices'] or 'none'} |"
              )
          lines += [
              '',
              'The JSON file contains every coefficient modulo p^2 and every exact Mahler valuation.',
          ]
          (OUT/'Q564-mahler-audit.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines[:12]))
          PY

      - name: Commit audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drops/Q564-mahler-audit.csv drops/Q564-mahler-audit.json drops/Q564-mahler-audit.md
          git commit -m 'Record Q564 Mahler coefficient audit'
          git pull --rebase origin chatgpt-drop
          git push origin HEAD:chatgpt-drop
