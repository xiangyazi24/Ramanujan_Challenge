name: q5972-numeric-audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free Node audit
        run: |
          set +e
          N=5000000 node scripts/q5972_numeric_audit.js > /tmp/q5972.out 2>&1
          status=$?
          cat /tmp/q5972.out
          echo "exit_status=$status" >> /tmp/q5972.out
          exit 0
      - name: Publish exact output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = 'Q5972 EXACT NUMERIC OUTPUT\n\n```text\n' + fs.readFileSync('/tmp/q5972.out','utf8') + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
