name: Q3572 cached exact inclusive Gamma47 p5000
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact cached p5000 census
        shell: bash
        run: |
          cat > /tmp/q3572_p5000.py <<'PY'
          import sys,gc,time
          sys.set_int_max_str_digits(0)
          from math import gcd,isqrt,lcm
          from collections import Counter,defaultdict
          from sympy import factorint
          H=0;PLIM=5000
          def primes_lt(n):
              a=bytearray(b'\x01')*n;a[0:2]=b'\x00\x00'
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              if N==0:return [1]
              b=[1,5]
              for n in range(1,N):
                  num=(34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1]
                  den=(n+1)**3;assert num%den==0;b.append(num//den)
              return b[:N+1]
          def sig(m,s):
              r=(-m-1)%s;return s if r==0 else r
          def X(m,s):return (m+1+sig(m,s))//s
          def f2(m):
              c=(m+1)%2;N=(m+c+1)//2;u=-((-(1-c))//2);sg=c+2*u;k=(N-2*c-2)//3;d=N-2*c-2-3*k
              return 3*sg-3+2*d
          def wins(m):
              lo=X(m,7);hi=(m-f2(m))//6
              return lo,hi,(max(1,2*hi-X(m,4)+1),min(lo-1,1+(m-sig(m,4))//4)),(max(1,hi-X(m,7)+1),min(lo-1,1+(m-sig(m,7))//7))
          t0=time.time();allps=primes_lt((7*PLIM)//6+50);smallb=apery(max(allps));events=[]
          for p in allps:
              if p>=PLIM:break
              if p<5:continue
              for j in range(p):
                  if smallb[j]%p:continue
                  m=6*p+j;lo,hi,i4,i7=wins(m)
                  if lo<=p<=hi and f2(m)<=j<=p-1-sig(m,7):events.append((p,j,m))
          print('EVENTS',len(events),'elapsed',time.time()-t0,flush=True)
          W=[];maxnode=0
          for p,j,m in events:
              lo,hi,i4,i7=wins(m);W.append((lo,hi,i4,i7))
              for s,I in ((4,i4),(7,i7)):
                  A,B=I
                  if B>=1:maxnode=max(maxnode,sig(m,s)+s*(B-1))
          print('MAX_NODE',maxnode,flush=True);b=apery(maxnode);print('APERY_READY elapsed',time.time()-t0,flush=True)
          G=[0]*len(events)
          groups=defaultdict(list)
          for idx,(p,j,m) in enumerate(events):
              for s,pos in ((4,2),(7,3)):
                  A,B=W[idx][pos];groups[(s,sig(m,s))].append((idx,A,B,X(m,s)))
          def first_differences(values):
              r=list(values);out=[]
              while r:
                  out.append(r[0]);r=[y-x for x,y in zip(r,r[1:])]
              return out
          for gi,key in enumerate(sorted(groups),1):
              s,sg=key;items=groups[key];maxB=max(B for idx,A,B,x in items)
              print('PHASE_BEGIN',key,'items',len(items),'maxB',maxB,'elapsed',time.time()-t0,flush=True)
              d=first_differences([b[sg+s*t] for t in range(maxB)])
              print('PHASE_DIFF_READY',key,'elapsed',time.time()-t0,flush=True)
              for ni,(idx,A,B,x) in enumerate(items,1):
                  U=[1]*B
                  for k in range(B-1):
                      num=U[k]*(-(x+k));den=k+1;assert num%den==0;U[k+1]=num//den
                  T=[0]*(B+1);T[1]=d[0]
                  for k in range(1,B):T[k+1]=T[k]+U[k]*d[k]
                  g=G[idx]
                  for K in range(A,B-1):
                      v0=(x+K)*T[K]+(K+1)*T[K+1];v1=(x+K+1)*T[K+1]+(K+2)*T[K+2];ak=x+2*K+1
                      if x%2==0:a=(ak+1)//2;bb=-(ak-1)//2
                      else:a=-1;bb=1
                      g=gcd(g,abs(a*v0+bb*v1))
                  G[idx]=g
                  if ni%25==0:print('PHASE_PROGRESS',key,ni,'/',len(items),'elapsed',time.time()-t0,flush=True)
              del d;gc.collect();print('PHASE_END',key,'elapsed',time.time()-t0,flush=True)
          initials=[2,5,73,1445,33001,819005,21460825];LC=1
          for z in initials:LC=lcm(LC,z)
          dist=Counter();facdist=Counter();bad=[];newrows=[];rows=[]
          for idx,(p,j,m) in enumerate(events):
              lo,hi,i4,i7=W[idx];targets=[]
              for q in allps:
                  if q<lo:continue
                  if q>hi:break
                  jq=m-6*q
                  if 0<=jq<q and b[jq]%q==0:targets.append(q)
              R=1
              for q in targets:R*=q
              assert G[idx]%R==0,(p,j,m,G[idx],R,targets)
              e=G[idx]//R;fac=tuple(sorted(factorint(e).items()));dist[e]+=1;facdist[fac]+=1
              row=(p,j,m,tuple(targets),e,fac);rows.append(row)
              if LC%e:bad.append(row)
              if e not in {1,2,5,10,17,19}:newrows.append(row)
          print('MAX_EPS',max(dist));print('EPS_SET',sorted(dist));print('EPS_DIST',dict(sorted(dist.items())))
          print('FACT_DIST',dict(sorted(facdist.items(),key=lambda kv:str(kv[0]))))
          print('NEW_VALUES',sorted(set(dist)-{1,2,5,10,17,19}));print('NEW_ROWS_COUNT',len(newrows));print('NEW_ROWS',newrows)
          print('INITIAL_LCM',LC,'FACT',tuple(sorted(factorint(LC).items())));print('ALL_DIVIDE_INITIAL_LCM',not bad);print('NONDIVIDING_COUNT',len(bad));print('NONDIVIDING_ROWS',bad)
          print('ROWS_BEGIN')
          for r in rows:print('ROW',r)
          print('ROWS_END');print('TOTAL_ELAPSED',time.time()-t0)
          PY
          python /tmp/q3572_p5000.py
