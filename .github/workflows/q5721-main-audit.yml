name: Q3572 diagnose exact baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baseline diagnostics
        shell: bash
        run: |
          cat > /tmp/q3572_diag2.py <<'PY'
          import sys
          sys.set_int_max_str_digits(0)
          from math import gcd,isqrt
          from collections import Counter
          H=0;LIM=400
          def primes(n):
              a=bytearray(b'\x01')*n;a[0:2]=b'\x00\x00'
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              b=[1,5]
              for n in range(1,N):
                  b.append(((34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1])//(n+1)**3)
              return b[:N+1]
          def sig(m,s):
              r=(-m-1)%s;return s if r==0 else r
          def X(m,s):return (m+1+sig(m,s))//s
          def f2(m):
              c=(m+1)%2;N=(m+c+1)//2;u=-((-(1-c))//2);sg=c+2*u;k=(N-2*c-2)//3;d=N-2*c-2-3*k
              return 3*sg-3+2*d
          def wins(m):
              lo=X(m,7);hi=(m-f2(m))//6
              return lo,hi,(max(1,2*hi-X(m,4)+1),min(lo-1,1+(m-sig(m,4))//4)),(max(1,hi-X(m,7)+1),min(lo-1,1+(m-sig(m,7))//7))
          def diffs(v):
              out=[];r=list(v)
              while r:out.append(r[0]);r=[y-x for x,y in zip(r,r[1:])]
              return out
          def cs(m,s,A,B,b):
              x=X(m,s);d=diffs([b[sig(m,s)+s*t] for t in range(B)])
              U=[1]
              for k in range(B-1):U.append(U[-1]*(-(x+k))//(k+1))
              T=[None]*(B+1);T[1]=d[0]
              for K in range(1,B):T[K+1]=T[K]+U[K]*d[K]
              out=[]
              for K in range(A,B-1):
                  v0=(x+K)*T[K]+(K+1)*T[K+1];v1=(x+K+1)*T[K+1]+(K+2)*T[K+2];ak=x+2*K+1
                  a,bb=(((ak+1)//2,-(ak-1)//2) if x%2==0 else (-1,1));out.append(a*v0+bb*v1)
              return out
          ps=primes(LIM);bs=apery(LIM-1);events=[]
          for p in ps:
              if p<5:continue
              for j in range(p):
                  if bs[j]%p:continue
                  m=6*p+j;lo,hi,i4,i7=wins(m)
                  if lo<=p<=hi and f2(m)<=j<=p-1-sig(m,7):events.append((p,j,m,bs[j]%(p*p)!=0))
          for cut in [31,37,41,43]:
              print('CUT',cut,'all',sum(p>=cut for p,j,m,v in events),'v1',sum(p>=cut and v for p,j,m,v in events))
          b=apery(max(m for p,j,m,v in events));dist=Counter();mismatch=Counter();erows=[]
          for p,j,m,vone in events:
              lo,hi,i4,i7=wins(m);c4=cs(m,4,*i4,b);c7=cs(m,7,*i7,b);allc=c4+c7
              G=0
              for z in allc:G=gcd(G,abs(z))
              t=[]
              for q in ps:
                  if lo<=q<=hi:
                      jq=m-6*q
                      if 0<=jq<q and b[jq]%q==0:t.append(q)
              R=1
              for q in t:R*=q
              e=G//R;dist[e]+=1
              if e==19:erows.append((p,j,m,vone,tuple(t),i4,i7))
              variants={
                'first1':[c4[0],c7[0]],
                'first2':c4[:2]+c7[:2],
                'first3':c4[:3]+c7[:3],
                'ends':[c4[0],c4[-1],c7[0],c7[-1]],
                'triad':[c4[0],c4[len(c4)//2],c4[-1],c7[0],c7[len(c7)//2],c7[-1]],
              }
              for nm,vv in variants.items():
                  g=0
                  for z in vv:g=gcd(g,abs(z))
                  if g!=G:mismatch[nm]+=1
          print('DIST',dict(sorted(dist.items())))
          print('EPS19_ROWS',erows)
          print('SPARSE_MISMATCH',dict(mismatch))
          PY
          python /tmp/q3572_diag2.py
