name: Q3572 resolve event count
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Count target pairs and distinct primes
        shell: bash
        run: |
          python - <<'PY'
          from math import isqrt
          def primes(n):
              a=bytearray(b'\1')*n;a[0:2]=b'\0\0'
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\0'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              b=[1,5]
              for n in range(1,N):b.append(((34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1])//(n+1)**3)
              return b[:N+1]
          def sig(m,s):
              r=(-m-1)%s;return s if r==0 else r
          def X(m,s):return (m+1+sig(m,s))//s
          def f2(m):
              c=(m+1)%2;N=(m+c+1)//2;u=-((-(1-c))//2);sg=c+2*u;k=(N-2*c-2)//3;d=N-2*c-2-3*k
              return 3*sg-3+2*d
          ps=primes(400);b=apery(399);ev=[]
          for p in ps:
              if p<5:continue
              for j in range(p):
                  if b[j]%p:continue
                  m=6*p+j;lo=X(m,7);hi=(m-f2(m))//6
                  if lo<=p<=hi and f2(m)<=j<=p-1-sig(m,7):ev.append((p,j,m))
          print('PAIR_EVENTS',len(ev))
          print('DISTINCT_P',len(set(p for p,j,m in ev)))
          from collections import Counter
          c=Counter(p for p,j,m in ev)
          print('MULTI_ZERO_PRIMES',[(p,k) for p,k in sorted(c.items()) if k>1])
          PY
