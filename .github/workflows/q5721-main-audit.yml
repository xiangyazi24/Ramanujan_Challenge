name: Q3572 infer Fable census height
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Count p<400 target events across H
        shell: bash
        run: |
          cat > /tmp/q3572_hscan.py <<'PY'
          from math import isqrt
          def primes_lt(n):
              a=bytearray(b'\x01')*n;a[0:2]=b'\x00\x00'
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              b=[1,5]
              for n in range(1,N):
                  num=(34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1]
                  b.append(num//(n+1)**3)
              return b[:N+1]
          ps=primes_lt(400); b=apery(399)
          for H in range(0,31):
              def sigma(m,s):
                  r=(-m-1-H)%s
                  return H+s if r==0 else H+r
              def X(m,s):return (m+1+sigma(m,s))//s
              def f2(m):
                  c=(m+1)%2;N=(m+c+1)//2
                  numer=H+1-c;u=-((-numer)//2);sg=c+2*u
                  k=(N-2*c-H-2)//3;d=N-2*c-H-2-3*k
                  if sg!=sigma(m,2): raise RuntimeError((H,m,sg,sigma(m,2)))
                  return 3*sg+2*H-3+2*d
              cnt=cntv=0
              rows=[]
              for p in ps:
                  if p<5:continue
                  for j in range(p):
                      if b[j]%p:continue
                      m=6*p+j;lo=X(m,7);hi=(m-f2(m))//6
                      if lo<=p<=hi and f2(m)<=j<=p-1-sigma(m,7):
                          cnt+=1;cntv+=(b[j]%(p*p)!=0);rows.append((p,j))
              mark=' ***' if cnt==65 or cntv==65 else ''
              print('H',H,'all',cnt,'v1',cntv,mark)
          PY
          python /tmp/q3572_hscan.py
