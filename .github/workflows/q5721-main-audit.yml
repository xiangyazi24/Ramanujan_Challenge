name: Q3572 exact Gamma47 census p1000
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact census p<400 and p<1000
        shell: bash
        run: |
          cat > /tmp/q3572_p1000.py <<'PY'
          import sys
          sys.set_int_max_str_digits(0)
          from math import gcd,isqrt,lcm
          from collections import Counter,defaultdict
          H=0
          def primes_lt(n):
              a=bytearray(b'\x01')*n
              if n:a[0]=0
              if n>1:a[1]=0
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              if N==0:return [1]
              b=[1,5]
              for n in range(1,N):
                  num=(34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1]
                  den=(n+1)**3
                  assert num%den==0
                  b.append(num//den)
              return b[:N+1]
          def sigma(m,s):
              r=(-m-1)%s
              return s if r==0 else r
          def X(m,s):return (m+1+sigma(m,s))//s
          def f2(m):
              c=(m+1)%2;N=(m+c+1)//2;u=-((-(1-c))//2);sg=c+2*u
              k=(N-2*c-2)//3;d=N-2*c-2-3*k
              assert sg==sigma(m,2) and d in (0,1,2)
              return 3*sg-3+2*d
          def windows(m):
              lo=X(m,7);hi=(m-f2(m))//6;x4=X(m,4);x7=X(m,7)
              i4=(max(1,2*hi-x4+1),min(lo-1,1+(m-sigma(m,4))//4))
              i7=(max(1,hi-x7+1),min(lo-1,1+(m-sigma(m,7))//7))
              return lo,hi,i4,i7
          def diffs(vals):
              row=list(vals);out=[]
              while row:
                  out.append(row[0]);row=[b-a for a,b in zip(row,row[1:])]
              return out
          def cstars(m,s,A,B,b):
              if B-A+1<3:return []
              sg=sigma(m,s);x=X(m,s)
              d=diffs([b[sg+s*t] for t in range(B)])
              U=[1]
              for k in range(B-1):U.append(U[-1]*(-(x+k))//(k+1))
              T=[None]*(B+1);T[1]=d[0]
              for K in range(1,B):T[K+1]=T[K]+U[K]*d[K]
              out=[]
              for K in range(A,B-1):
                  v0=(K+1)*T[K+1]+(x+K)*T[K]
                  v1=(K+2)*T[K+2]+(x+K+1)*T[K+1]
                  ak=x+2*K+1
                  a,bb=(((ak+1)//2,-(ak-1)//2) if x%2==0 else (-1,1))
                  out.append(a*v0+bb*v1)
              return out
          def gamma47(m,b):
              lo,hi,i4,i7=windows(m);g=0
              for s,I in ((4,i4),(7,i7)):
                  for z in cstars(m,s,*I,b):g=gcd(g,abs(z))
              return g
          def factor(n):
              out=[];d=2
              while d*d<=n:
                  if n%d==0:
                      e=0
                      while n%d==0:n//=d;e+=1
                      out.append((d,e))
                  d=3 if d==2 else d+2
              if n>1:out.append((n,1))
              return tuple(out)
          initials=[2,5,73,1445,33001,819005,21460825]
          L=1
          for z in initials:L=lcm(L,z)
          print('INITIAL_LCM',L,'FACT',factor(L))
          def run(limit, expect=None):
              ps=primes_lt(limit);bs=apery(limit-1); bym=defaultdict(set)
              for p in ps:
                  if p<5:continue
                  for j in range(p):
                      if bs[j]%p:continue
                      m=6*p+j;lo,hi,i4,i7=windows(m)
                      if lo<=p<=hi and f2(m)<=j<=p-1-sigma(m,7):bym[m].add(p)
              events=sorted(bym)
              print('RANGE',limit,'EVENTS',len(events),'PAIR_HITS',sum(len(v) for v in bym.values()),'MULTI_M',sum(len(v)>1 for v in bym.values()))
              if expect is not None: assert len(events)==expect,(limit,len(events))
              maxm=max(events,default=0);b=apery(maxm);dist=Counter();rows=[];baddiv=[]
              for idx,m in enumerate(events,1):
                  lo,hi,i4,i7=windows(m)
                  targets=[]
                  for q in ps:
                      if lo<=q<=hi:
                          j=m-6*q
                          if 0<=j<q and b[j]%q==0:targets.append(q)
                  R=1
                  for q in targets:R*=q
                  G=gamma47(m,b);assert R and G%R==0,(m,G,R,targets)
                  e=G//R;fac=factor(e);dist[e]+=1
                  if L%e:baddiv.append((m,e,fac,tuple(targets)))
                  rows.append((m,tuple(targets),e,fac))
                  if idx%25==0:print('PROGRESS',limit,idx,'/',len(events),flush=True)
              print('SUMMARY',limit,'MAX_EPS',max(dist) if dist else None,'EPS_SET',sorted(dist),'DIST',dict(sorted(dist.items())))
              print('NEW_BEYOND_BASE',sorted(set(dist)-{1,2,5,10,17,19}))
              print('ALL_DIVIDE_INITIAL_LCM',not baddiv,'BAD',baddiv)
              print('ROWS_BEGIN',limit)
              for r in rows:print('ROW',r)
              print('ROWS_END',limit)
              return dist
          run(400,65)
          run(1000)
          PY
          python /tmp/q3572_p1000.py
