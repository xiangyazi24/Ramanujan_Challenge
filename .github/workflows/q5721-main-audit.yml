name: Q5721 exact recurrence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5721_B_recurrence_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install exact symbolic dependency
        run: python3 -m pip install --quiet sympy
      - name: Run exact audit
        shell: bash
        run: python3 problems/3.2/research/scripts/q5721_B_recurrence_audit.py
