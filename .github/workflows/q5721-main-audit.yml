name: Q3572 reconstructed Gamma47 baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
concurrency:
  group: q3572-gamma47-baseline
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate p<400 baseline
        shell: bash
        run: |
          cat > /tmp/q3572_baseline.py <<'PY'
          from math import gcd, isqrt
          from collections import Counter

          H=0
          LIMIT=400

          def primes_lt(n):
              sieve=bytearray(b'\x01')*n
              if n: sieve[0]=0
              if n>1: sieve[1]=0
              for q in range(2,isqrt(n-1)+1):
                  if sieve[q]:
                      sieve[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if sieve[q]]

          def apery(limit):
              b=[1]
              if limit==0: return b
              b.append(5)
              for n in range(1,limit):
                  P=34*n**3+51*n**2+27*n+5
                  num=P*b[n]-n**3*b[n-1]
                  den=(n+1)**3
                  assert num%den==0
                  b.append(num//den)
              return b

          def sigma(m,s):
              r=(-m-1-H)%s
              return H+s if r==0 else H+r

          def X(m,s):
              sg=sigma(m,s)
              assert (m+1+sg)%s==0
              return (m+1+sg)//s

          def f2(m):
              c=(m+1)%2
              N=(m+c+1)//2
              numer=H+1-c
              u=-((-numer)//2)  # ceil(numer/2)
              sg=c+2*u
              k=(N-2*c-H-2)//3
              delta=N-2*c-H-2-3*k
              assert delta in (0,1,2)
              assert sg==sigma(m,2)
              return 3*sg+2*H-3+2*delta

          def windows(m):
              Plo=X(m,7)
              Phi=(m-f2(m))//6
              X4,X7=X(m,4),X(m,7)
              s4,s7=sigma(m,4),sigma(m,7)
              A4=max(1,2*Phi-X4+1)
              B4=min(Plo-1,1+(m-s4)//4)
              A7=max(1,Phi-X7+1)
              B7=min(Plo-1,1+(m-s7)//7)
              return Plo,Phi,(A4,B4),(A7,B7)

          def diffs0(vals, upto):
              row=list(vals)
              out=[]
              for k in range(upto+1):
                  out.append(row[0])
                  if k<upto:
                      row=[row[i+1]-row[i] for i in range(len(row)-1)]
              return out

          def T_values(m,s,B,b):
              sg=sigma(m,s); x=X(m,s)
              vals=[b[sg+s*t] for t in range(B)]
              d=diffs0(vals,B-1)
              U=[1]
              for k in range(B-1):
                  num=U[-1]*(-(x+k))
                  assert num%(k+1)==0
                  U.append(num//(k+1))
              T=[None]*(B+1)
              T[1]=d[0]
              for K in range(1,B):
                  T[K+1]=T[K]+U[K]*d[K]
              return T

          def cstar_values(m,s,A,B,b):
              if B-A+1<3: return []
              T=T_values(m,s,B,b)
              x=X(m,s)
              out=[]
              for K in range(A,B-1):
                  V0=(K+1)*T[K+1]+(x+K)*T[K]
                  V1=(K+2)*T[K+2]+(x+K+1)*T[K+1]
                  AK=x+2*K+1
                  if x%2==0:
                      a=(AK+1)//2
                      bb=-(AK-1)//2
                  else:
                      a=-1; bb=1
                  C=a*V0+bb*V1
                  out.append(C)
              return out

          def gamma47(m,b):
              Plo,Phi,I4,I7=windows(m)
              vals=[]
              for s,(A,B) in ((4,I4),(7,I7)):
                  vals += cstar_values(m,s,A,B,b)
              if not vals: return 0
              g=0
              for v in vals: g=gcd(g,abs(v))
              return g

          ps=primes_lt(LIMIT)
          bsmall=apery(LIMIT-1)
          raw=[]
          for p in ps:
              if p<5: continue
              for j in range(p):
                  if bsmall[j]%p: continue
                  m=6*p+j
                  Plo,Phi,I4,I7=windows(m)
                  core=(Plo<=p<=Phi and f2(m)<=j<=p-1-sigma(m,7))
                  if not core: continue
                  v1=(bsmall[j]%(p*p)!=0)
                  raw.append((p,j,m,v1))

          maxm=max((m for _,_,m,_ in raw),default=0)
          b=apery(maxm)
          cache={}
          def eval_event(ev):
              p,j,m,v1=ev
              if m not in cache:
                  G=gamma47(m,b)
                  Plo,Phi,_,_=windows(m)
                  targets=[]
                  for q in ps:
                      if q<Plo or q>Phi: continue
                      jq=m-6*q
                      if 0<=jq<q and b[jq]%q==0:
                          targets.append(q)
                  R=1
                  for q in targets: R*=q
                  assert G%R==0,(ev,G,R,targets)
                  cache[m]=(G,R,G//R,tuple(targets))
              return cache[m]

          for label,events in [('all-core-targets',raw),('valuation-one', [e for e in raw if e[3]])]:
              eps=[]
              bad=[]
              print('===',label,'events',len(events),'===')
              for ev in events:
                  G,R,e,targets=eval_event(ev)
                  eps.append(e)
                  if e>19 or e not in {1,2,5,10,17,19}:
                      bad.append((ev,e,targets))
              print('EPS_DIST',dict(sorted(Counter(eps).items())))
              print('EPS_MAX',max(eps) if eps else None)
              print('EPS_SET',sorted(set(eps)))
              print('OUTSIDE_EXPECTED',bad[:30], 'count=',len(bad))
          PY
          python /tmp/q3572_baseline.py
