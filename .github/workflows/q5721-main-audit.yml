name: Q3572 exact inclusive Gamma47 p1000
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5721-main-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact p1000 census
        shell: bash
        run: |
          cat > /tmp/q3572_p1000.py <<'PY'
          import sys
          sys.set_int_max_str_digits(0)
          from math import gcd,isqrt,lcm
          from collections import Counter
          H=0; PLIM=1000
          def primes_lt(n):
              a=bytearray(b'\x01')*n;a[0:2]=b'\x00\x00'
              for q in range(2,isqrt(n-1)+1):
                  if a[q]:a[q*q:n:q]=b'\x00'*(((n-1-q*q)//q)+1)
              return [q for q in range(2,n) if a[q]]
          def apery(N):
              b=[1,5]
              for n in range(1,N):
                  num=(34*n**3+51*n**2+27*n+5)*b[n]-n**3*b[n-1]
                  den=(n+1)**3; assert num%den==0;b.append(num//den)
              return b[:N+1]
          def sig(m,s):
              r=(-m-1)%s;return s if r==0 else r
          def X(m,s):return (m+1+sig(m,s))//s
          def f2(m):
              c=(m+1)%2;N=(m+c+1)//2;u=-((-(1-c))//2);sg=c+2*u;k=(N-2*c-2)//3;d=N-2*c-2-3*k
              return 3*sg-3+2*d
          def wins(m):
              lo=X(m,7);hi=(m-f2(m))//6
              return lo,hi,(max(1,2*hi-X(m,4)+1),min(lo-1,1+(m-sig(m,4))//4)),(max(1,hi-X(m,7)+1),min(lo-1,1+(m-sig(m,7))//7))
          def diffs(v):
              out=[];r=list(v)
              while r:out.append(r[0]);r=[y-x for x,y in zip(r,r[1:])]
              return out
          def cs(m,s,A,B,b):
              x=X(m,s);d=diffs([b[sig(m,s)+s*t] for t in range(B)])
              U=[1]
              for k in range(B-1):U.append(U[-1]*(-(x+k))//(k+1))
              T=[None]*(B+1);T[1]=d[0]
              for K in range(1,B):T[K+1]=T[K]+U[K]*d[K]
              out=[]
              for K in range(A,B-1):
                  v0=(x+K)*T[K]+(K+1)*T[K+1];v1=(x+K+1)*T[K+1]+(K+2)*T[K+2];ak=x+2*K+1
                  a,bb=(((ak+1)//2,-(ak-1)//2) if x%2==0 else (-1,1));out.append(a*v0+bb*v1)
              return out
          def factor(n):
              n=abs(n);out=[];d=2
              while d*d<=n:
                  if n%d==0:
                      e=0
                      while n%d==0:n//=d;e+=1
                      out.append((d,e))
                  d=3 if d==2 else d+2
              if n>1:out.append((n,1))
              return tuple(out)
          initials=[2,5,73,1445,33001,819005,21460825];LC=1
          for z in initials:LC=lcm(LC,z)
          allps=primes_lt((7*PLIM)//6+20); smallb=apery(max(allps))
          events=[]
          for p in allps:
              if p>=PLIM:break
              if p<5:continue
              for j in range(p):
                  if smallb[j]%p:continue
                  m=6*p+j;lo,hi,i4,i7=wins(m)
                  if lo<=p<=hi and f2(m)<=j<=p-1-sig(m,7):events.append((p,j,m))
          print('EVENTS',len(events),flush=True)
          maxm=max(m for _,_,m in events);b=apery(maxm);dist=Counter();facdist=Counter();bad=[];newrows=[]
          for idx,(p,j,m) in enumerate(events,1):
              lo,hi,i4,i7=wins(m);G=0
              for s,I in ((4,i4),(7,i7)):
                  for z in cs(m,s,*I,b):G=gcd(G,abs(z))
              targets=[]
              for q in allps:
                  if q<lo:continue
                  if q>hi:break
                  jq=m-6*q
                  if 0<=jq<q and b[jq]%q==0:targets.append(q)
              R=1
              for q in targets:R*=q
              assert G%R==0,(p,j,m,G,R,targets)
              e=G//R;f=factor(e);dist[e]+=1;facdist[f]+=1
              if LC%e:bad.append((p,j,m,tuple(targets),e,f))
              if e not in {1,2,5,10,17,19}:newrows.append((p,j,m,tuple(targets),e,f))
              if idx%25==0:print('PROGRESS',idx,'/',len(events),flush=True)
          print('MAX_EPS',max(dist));print('EPS_SET',sorted(dist));print('EPS_DIST',dict(sorted(dist.items())))
          print('FACT_DIST',dict(sorted(facdist.items(),key=lambda kv:str(kv[0]))))
          print('NEW_VALUES',sorted(set(dist)-{1,2,5,10,17,19}));print('NEW_ROWS',newrows)
          print('INITIAL_LCM',LC,'FACT',factor(LC));print('ALL_DIVIDE_INITIAL_LCM',not bad);print('NONDIVIDING_ROWS',bad)
          PY
          python /tmp/q3572_p1000.py
