name: Q2386 fixed-r row-root audit

on:
  push:
    branches: [chatgpt-drop]
    paths:
      - '.github/workflows/q2386-row-roots.yml'
      - 'problems/3.2/research/scripts/q2386_row_roots.gp'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
      - run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - run: |
          gp -q problems/3.2/research/scripts/q2386_row_roots.gp 2>&1 | tee problems/3.2/research/q2386-row-roots.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/3.2/research/q2386-row-roots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Q2386 fixed-r row-root transcript"
            git pull --rebase origin chatgpt-drop
            git push origin HEAD:chatgpt-drop
          fi
