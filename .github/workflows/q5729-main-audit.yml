name: Q5729 temporary main audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q5729-main-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch isolated Q5729 audit
        shell: bash
        run: |
          git fetch origin q5729-audit
          git show origin/q5729-audit:problems/3.2/research/scripts/q5729_diagonal_audit.py > /tmp/q5729.py
      - name: Run exact audit
        shell: bash
        run: |
          set +e
          python3 /tmp/q5729.py > /tmp/q5729-audit.out 2>&1
          echo $? > /tmp/q5729-audit.status
          exit 0
      - name: Persist output on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout q5729-audit
          cp /tmp/q5729-audit.out q5729-audit.out
          cp /tmp/q5729-audit.status q5729-audit.status
          git add q5729-audit.out q5729-audit.status
          git commit -m 'Record Q5729 diagonal audit output' || exit 0
          git push origin HEAD:q5729-audit
