name: Q5707 cross-model shell audit

on:
  push:
    branches: [chatgpt-drop]
    paths:
      - '.github/workflows/q5707-cross-model-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Run exact shell audit
        shell: bash
        run: |
          set +e
          mkdir -p drops
          python3 problems/3.2/research/scripts/q5707_cross_model_shell.py > drops/Q5707-audit-29a6d969.txt 2>&1
          echo $? > drops/Q5707-audit-29a6d969.status
          exit 0
      - name: Persist audit output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drops/Q5707-audit-29a6d969.txt drops/Q5707-audit-29a6d969.status
          git commit -m 'Record Q5707 exact shell audit output' || exit 0
          git push origin HEAD:chatgpt-drop
