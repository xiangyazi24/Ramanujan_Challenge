name: Q3291 temporary ray audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/q3291-run-ray-audit-temporary.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-drop
          fetch-depth: 0
      - name: Run exact ray audit through n=5000
        run: |
          python3 chatgpt-drop/Q3291_ray_audit.py > chatgpt-drop/Q3291_ray_audit.out 2>&1
      - name: Commit audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-drop/Q3291_ray_audit.out
          git commit -m 'Record Q3291 ray audit output' || exit 0
          git push origin HEAD:chatgpt-drop
