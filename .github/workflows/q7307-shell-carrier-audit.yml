name: Q7307 shell carrier audit

on:
  push:
    branches:
      - q7307-audit
    paths:
      - problems/3.2/research/scripts/q7307_shell_carrier_verifier.py
      - .github/workflows/q7307-shell-carrier-audit.yml

permissions:
  contents: write

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Normalize verifier audit domains
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("problems/3.2/research/scripts/q7307_shell_carrier_verifier.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "complete local cutoff support test for odd primes p<=197 with n<p^2.",
                  "complete local cutoff support test for odd primes p<=197 with J<p and n<p^2.",
              ),
              (
                  "valuation stress sweeps through X=128 (K=X) and X=40 (every K<p).",
                  "valuation stress sweeps through X=128 (K=X) and X=40 (0<=K<=min(p-1,m)).",
              ),
              (
                  '"all_K_rule": "0 <= K < p for every X<p<=2X and X<=m<X^2",',
                  '"all_K_rule": "0 <= K <= min(p-1,m) for every X<p<=2X and X<=m<X^2",',
              ),
              (
                  "            for prime in cutoff_primes:\n                if n >= prime * prime:\n                    continue",
                  "            for prime in cutoff_primes:\n                if cutoff >= prime or n >= prime * prime:\n                    continue",
              ),
              (
                  '"condition": "n < p^2",',
                  '"condition": "J < p and n < p^2",',
              ),
              (
                  "                for cutoff in range(prime):",
                  "                for cutoff in range(min(prime, m + 1)):",
              ),
              (
                  '"K_rule": "0 <= K < p",',
                  '"K_rule": "0 <= K <= min(p-1,m)",',
              ),
          ]
          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise RuntimeError(
                      f"non-unique Q7307 domain patch: old={old_count}, new={new_count}, needle={old!r}"
                  )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run standalone verifier and hash outputs
        shell: bash
        run: |
          set +e
          python3 --version > q7307-audit.out 2>&1
          python3 problems/3.2/research/scripts/q7307_shell_carrier_verifier.py >> q7307-audit.out 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > q7307-audit.status
          git rev-parse HEAD > q7307-audit.input-commit
          sha256sum problems/3.2/research/scripts/q7307_shell_carrier_verifier.py > q7307-verifier.sha256
          sha256sum q7307-audit.out > q7307-audit.out.sha256

      - name: Persist exact transcript on the audit branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f problems/3.2/research/scripts/q7307_shell_carrier_verifier.py q7307-audit.out q7307-audit.out.sha256 q7307-audit.status q7307-audit.input-commit q7307-verifier.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist Q7307 exact audit transcript"
          git push origin HEAD:q7307-audit
