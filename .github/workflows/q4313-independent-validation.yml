name: Q4313 independent exact-gcd validation

on:
  push:
    branches: [q4313-independent-compute]
    paths:
      - '.github/workflows/q4313-independent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4313-independent-compute
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact standard-library implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/q4313/classes scratch/q4313/results-q5000
          mkdir -p scratch/q4313/classes
          javac -Xlint:all -Werror \
            -d scratch/q4313/classes \
            scratch/q4313/Q4313IndependentCensus.java
      - name: Run exact census through q=5000
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v java -Xmx12g \
            -cp scratch/q4313/classes Q4313IndependentCensus \
            --min-q 17 \
            --qmax 5000 \
            --prefixes 5000 \
            --out scratch/q4313/results-q5000 \
            > >(tee scratch/q4313/q5000-stdout.log) \
            2> >(tee scratch/q4313/q5000-time.log >&2)
          (cd scratch/q4313/results-q5000 && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: q4313-validation-q5000
          path: |
            scratch/q4313/results-q5000
            scratch/q4313/q5000-stdout.log
            scratch/q4313/q5000-time.log
          if-no-files-found: error
          retention-days: 30
