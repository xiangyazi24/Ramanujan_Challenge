name: Q7709 temporary inhomogeneous reflection audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q7709-temp-sage.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Q7709 Sage verifier (J-fixed variation basis)
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            sagemath/sagemath:10.6 \
            sage -python problems/3.2/research/scripts/q7709_inhomogeneous_hasse_reflection.sage
