name: Q3269 Q3228 audit
on:
  push:
    branches: [chatgpt-drop]
    paths:
      - 'chatgpt-drop/Q3269_q3228_audit.py'
      - '.github/workflows/q3269-q3228-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run supplied Q3228 audit
        run: python3 chatgpt-drop/Q3269_q3228_audit.py
