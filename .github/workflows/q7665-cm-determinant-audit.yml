name: Q7665 CM determinant audit
on:
  push:
    branches: [q7665-audit-33bde4bb]
    paths:
      - '.github/workflows/q7665-cm-determinant-audit.yml'
permissions:
  contents: read
jobs:
  sage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:latest
    steps:
      - name: High precision and exact Sage audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/q7665.sage <<'SAGE'
          N = 520
          P = lambda n: 34*n^3 + 51*n^2 + 27*n + 5

          # Exact Apéry b_n.
          b = [ZZ(1), ZZ(5)]
          for n in range(1, N):
              num = P(n)*b[n] - ZZ(n)^3*b[n-1]
              assert num % ZZ(n+1)^3 == 0
              b.append(num // ZZ(n+1)^3)
          assert b[:6] == [1,5,73,1445,33001,819005]

          # Exact reciprocal-period coefficients g_n.
          R.<x> = PowerSeriesRing(QQ, default_prec=N+1)
          F = R(sum(QQ(b[n])*x^n for n in range(N+1))).add_bigoh(N+1)
          Delta = (1 - 34*x + x^2).add_bigoh(N+1)
          G = (1/(F^2 * Delta.sqrt())).add_bigoh(N+1)
          g = [ZZ(G[n]) for n in range(N+1)]
          assert g[:11] == [1,7,192,5520,165168,5068320,158193648,4998104544,159364091280,5117524262976,165269990877984]

          # Exact inhomogeneous companion kappa_n and Xi_n.
          kap = [QQ(0), QQ(-36)]
          for r in range(2, N+1):
              kap.append((P(r-1)*kap[r-1] - ZZ(r-1)^3*kap[r-2] - 5*g[r]) / ZZ(r)^3)
          assert kap[2] == -QQ(1293)/2
          Xi = [ZZ(-1)]
          for r in range(1, N+1):
              Xi.append(Xi[-1] - 5*g[r]*b[r-1])
              assert QQ(Xi[r]) == ZZ(r)^3*(b[r-1]*kap[r] - b[r]*kap[r-1])

          # Fricke CM constant and ratio convergence, 300-bit precision.
          # Numerical zeta(3) from Apéry's exponentially convergent series:
          # zeta(3)=(5/2) sum_{k>=1} (-1)^(k-1)/(k^3 binom(2k,k)).
          RF = RealField(300)
          z3q = sum(QQ(5*(-1)^(k-1))/(2*ZZ(k)^3*binomial(2*k,k)) for k in range(1,220))
          z3 = RF(z3q)
          pi = RF.pi()
          C = 14*z3 - 20*pi^3/(9*RF(6).sqrt())
          rho = RF(17) + 12*RF(2).sqrt()
          lrho = rho.log()
          print('C_CM_300=', C)
          print('LOG_RHO=', lrho)
          for n in [50,100,200,400]:
              qn = RF(kap[n]) / RF(b[n])
              e = RF(n)*(qn-C)
              print('RATIO n=',n,' q=',qn,' n(q-C)=',e)
          for n in [50,100,200]:
              e1 = RF(n)*(RF(kap[n])/RF(b[n])-C)
              e2 = RF(2*n)*(RF(kap[2*n])/RF(b[2*n])-C)
              rich = 2*e2-e1
              print('C1_RICH n=',n,' value=',rich)

          # Natural minimal denominator-cleared 2x2 carrier.
          def H2(m,n):
              q = QQ(b[m])*kap[n] - QQ(b[n])*kap[m]
              return ZZ(q.numerator()), ZZ(q.denominator()), q

          # Three-row Richardson determinant: kills q_j=C+c/j exactly.
          # Rows [j*b_j, j*kappa_j, b_j]; take reduced numerator as integer carrier.
          def H3(n):
              M = matrix(QQ, [[ZZ(j)*b[j], ZZ(j)*kap[j], b[j]] for j in [n,n+1,n+2]])
              q = M.det()
              return ZZ(q.numerator()), ZZ(q.denominator()), q

          print('SMALL_H2')
          for n in range(1,9):
              h,den,q = H2(n-1,n)
              assert q == QQ(Xi[n])/ZZ(n)^3
              print(n,h,den,Xi[n])

          print('SMALL_H3')
          for n in range(1,8):
              h,den,q = H3(n)
              print(n,h,den)

          # Archimedean growth. Numerator height cannot be smaller than |rational determinant|.
          for n in [50,100,200,400]:
              h2,d2,q2 = H2(n,n+1)
              h3,d3,q3 = H3(n)
              print('HEIGHT n=',n,
                    ' logH2/n=', RF(abs(h2)).log()/n,
                    ' log|q2|/n=', RF(abs(q2)).log()/n,
                    ' logH3/n=', RF(abs(h3)).log()/n,
                    ' log|q3|/n=', RF(abs(q3)).log()/n,
                    ' 2logrho=',2*lrho,' 3logrho=',3*lrho)

          # Exact p-adic content at the two known transverse common rows.
          for r,p in [(13,17),(492,2237)]:
              print('COMMON_ROW',r,p,'vb=',valuation(b[r],p),'vXi=',valuation(Xi[r],p),
                    'vnumkap=',valuation(ZZ(kap[r].numerator()),p),'vdenkap=',valuation(ZZ(kap[r].denominator()),p))
              for m,n in [(r-1,r),(r,r+1)]:
                  h,den,q = H2(m,n)
                  print('H2_COMMON',m,n,p,'vh=',valuation(h,p),'vden=',valuation(den,p))
              for s in [r-2,r-1,r]:
                  h,den,q = H3(s)
                  print('H3_COMMON start=',s,'p=',p,'vh=',valuation(h,p),'vden=',valuation(den,p))

          # Exhaustive exact content statistics through 500.
          max_g2 = (ZZ(0),None)
          max_g3 = (ZZ(0),None)
          extra2 = []
          extra3 = []
          for n in range(1,500):
              h2,den2,q2 = H2(n,n+1)
              g2 = gcd(abs(h2), abs(b[n]*b[n+1]))
              if g2 > max_g2[0]: max_g2=(g2,n)
              if g2 > n+1: extra2.append((n,g2))
          for n in range(1,498):
              h3,den3,q3 = H3(n)
              Bprod = abs(b[n]*b[n+1]*b[n+2])
              g3 = gcd(abs(h3), Bprod)
              if g3 > max_g3[0]: max_g3=(g3,n)
              if g3 > n+2: extra3.append((n,g3))
          print('GCD2_MAX_THROUGH_500=',max_g2)
          print('GCD2_GT_INDEX_COUNT=',len(extra2),'ROWS=',extra2[:40])
          print('GCD3_MAX_THROUGH_499=',max_g3)
          print('GCD3_GT_INDEX_COUNT=',len(extra3),'ROWS=',extra3[:40])
          print('Q7665_SAGE_AUDIT_SUCCESS')
          SAGE
          sage /tmp/q7665.sage 2>&1 | tee /tmp/q7665.out
          grep -q '^Q7665_SAGE_AUDIT_SUCCESS$' /tmp/q7665.out
