name: Q5716 CD audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'problems/3.2/research/scripts/q5716_cd_audit.py'
      - '.github/workflows/q5716-pr-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Q5716 finite-field audit
        run: python3 problems/3.2/research/scripts/q5716_cd_audit.py
