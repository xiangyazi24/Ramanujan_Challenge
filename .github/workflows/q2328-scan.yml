name: q2328-associated-resultant-scan

on:
  push:
    branches:
      - chatgpt-q2328-scan
    paths:
      - 'problems/3.2/research/scripts/q2328_associated_resultant_scan.py'
      - '.github/workflows/q2328-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-q2328-scan
      - name: Run exact scan
        run: python3 problems/3.2/research/scripts/q2328_associated_resultant_scan.py > q2328-scan.out
      - name: Persist output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q2328-scan.out
          git commit -m 'Record Q2328 associated-resultant scan output' || exit 0
          git push origin HEAD:chatgpt-q2328-scan
