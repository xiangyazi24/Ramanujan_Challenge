name: Q7174 projective collision scan
on:
  push:
    branches: [q7174-compute]
    paths:
      - '.github/workflows/q7174-compute.yml'
permissions:
  contents: read
concurrency:
  group: q7174-projective-collision
  cancel-in-progress: true
jobs:
  scan:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact scanner
        shell: bash
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra -Wpedantic -Werror \
            problems/3.2/q7174_projective_collision_scan.cpp \
            -o /tmp/q7174_scan
      - name: Scan assigned primes
        shell: bash
        run: |
          set -o pipefail
          /tmp/q7174_scan --limit 100000 --shard ${{ matrix.shard }} \
            --shards 8 --threads 2 | tee q7174-shard-${{ matrix.shard }}.txt
      - name: Hash output
        shell: bash
        run: sha256sum q7174-shard-${{ matrix.shard }}.txt
